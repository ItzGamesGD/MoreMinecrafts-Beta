name: Ancient City Arena Validation

on:
  push:
    branches: [codex/ancient-city-arena-prototype-20261013]
    paths:
      - 'src/**'
      - 'scripts/arena_validation/**'
      - 'scripts/structures/**'
      - '.github/workflows/ancient-city-arena-validation.yml'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Authoritative build and all GameTests
        run: ./gradlew clean build
      - name: Validate reproducible template
        run: |
          python3 -m venv /tmp/arena-python
          /tmp/arena-python/bin/pip install -r scripts/structures/requirements.txt
          /tmp/arena-python/bin/python scripts/structures/generate_ancient_city_arena.py --check
          /tmp/arena-python/bin/python scripts/structures/validate_ancient_city_arena.py
      - name: Install proven client display and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 python3-pil
      - name: Generate real terrain and capture native client views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run arena-validation-results
          printf 'eula=true\n' > run/eula.txt
          RCON_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$RCON_PASSWORD"
          export RCON_PASSWORD
          cat > run/server.properties <<EOF
          level-name=arena-validation-world
          level-seed=2632027
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          white-list=false
          enforce-whitelist=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=$RCON_PASSWORD
          spawn-protection=0
          spawn-radius=0
          max-tick-time=-1
          pause-when-empty-seconds=-1
          view-distance=8
          simulation-distance=4
          EOF
          MOREMINECRAFTS_ARENA_VALIDATION=1 setsid timeout 1500s ./gradlew --no-daemon runServer > arena-validation-results/server.log 2>&1 &
          server_pid=$!
          cleanup() { kill -TERM -- "-$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 180); do
            if grep -Fq 'Done (' arena-validation-results/server.log; then ready=1; break; fi
            kill -0 "$server_pid" || exit 1
            sleep 2
          done
          test "$ready" -eq 1
          python3 scripts/arena_validation/rcon.py 'mmarena validate'
          found=0
          for attempt in $(seq 1 600); do
            if grep -Fq ARENA_WORLDGEN_VERIFIED arena-validation-results/server.log; then found=1; break; fi
            if grep -Fq ARENA_WORLDGEN_FAILED arena-validation-results/server.log; then exit 1; fi
            kill -0 "$server_pid" || exit 1
            sleep 2
          done
          test "$found" -eq 1
          printf 'guiScale:2\ntutorialStep:none\nlang:en_us\nrenderDistance:8\n' > run/options.txt
          bash scripts/arena_validation/capture_client.sh 0
          bash scripts/arena_validation/capture_client.sh 1
          python3 scripts/arena_validation/check_screenshots.py
      - name: Upload worldgen, screenshots, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancient-city-arena-visual-validation-${{ github.run_id }}
          path: |
            arena-validation-results/
            build/reports/tests/
            build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
