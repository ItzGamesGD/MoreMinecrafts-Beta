name: Ancient City Whole Variant Probe

on:
  push:
    branches: [codex/ancient-city-whole-variant-probe-20261014]
    paths:
      - 'src/**'
      - '.github/workflows/ancient-city-whole-variant-probe.yml'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Authoritative build and GameTests
        run: ./gradlew clean build

      - name: Run real Ancient City probe twice across a restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run whole-variant-probe-results
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-name=whole-variant-probe-world
          level-seed=2632026
          online-mode=false
          white-list=false
          enforce-whitelist=false
          spawn-protection=0
          spawn-radius=0
          max-tick-time=-1
          pause-when-empty-seconds=-1
          view-distance=4
          simulation-distance=4
          EOF

          run_probe() {
            local ordinal="$1"
            rm -f whole-variant-probe-results/worldgen.json
            MOREMINECRAFTS_WHOLE_VARIANT_PROBE=1 timeout 1200s ./gradlew --no-daemon runServer > "whole-variant-probe-results/server-${ordinal}.log" 2>&1 &
            local pid=$!
            local ok=0
            for attempt in $(seq 1 600); do
              if grep -Fq 'WHOLE_VARIANT_PROBE_VERIFIED' "whole-variant-probe-results/server-${ordinal}.log"; then
                ok=1
                break
              fi
              if grep -Fq 'WHOLE_VARIANT_PROBE_FAILED' "whole-variant-probe-results/server-${ordinal}.log"; then
                cat "whole-variant-probe-results/server-${ordinal}.log"
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 1
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "whole-variant-probe-results/server-${ordinal}.log"
                return 1
              fi
              sleep 2
            done
            test "$ok" -eq 1
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            test -f whole-variant-probe-results/worldgen.json
            cp whole-variant-probe-results/worldgen.json "whole-variant-probe-results/run-${ordinal}.json"
          }

          run_probe 1
          run_probe 2

      - name: Verify restart stability and city coherence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("whole-variant-probe-results")
          a = json.loads((root / "run-1.json").read_text())
          b = json.loads((root / "run-2.json").read_text())

          def city_map(data):
              return {
                  str(city["identity"]): {
                      "start_chunk_x": city["start_chunk_x"],
                      "start_chunk_z": city["start_chunk_z"],
                      "variant": city["variant"],
                  }
                  for city in data["cities"]
              }

          assert a["mixed_city_violations"] == 0
          assert b["mixed_city_violations"] == 0
          assert len(a["cities"]) >= 12
          assert len(b["cities"]) >= 12
          assert len(set(c["variant"] for c in a["cities"])) >= 2
          assert city_map(a) == city_map(b), "Ancient City variants changed across clean restart"
          print("WHOLE_VARIANT_RESTART_VERIFIED", len(a["cities"]), sorted(set(c["variant"] for c in a["cities"])))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancient-city-whole-variant-probe-${{ github.run_id }}
          path: |
            whole-variant-probe-results/
            build/reports/tests/
          if-no-files-found: error
          retention-days: 30
