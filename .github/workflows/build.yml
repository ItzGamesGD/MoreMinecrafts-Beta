name: Fabric CI

on:
  push:
    branches:
      - main
      - "stage-*/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: gradle build

      - name: Collect distributable mod JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/artifacts
          shopt -s nullglob
          candidates=(build/libs/*.jar)
          distributable=()

          for jar in "${candidates[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar) continue ;;
            esac
            distributable+=("$jar")
          done

          if [ "${#distributable[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable mod JAR, found ${#distributable[@]}:"
            printf '  %s\n' "${distributable[@]:-<none>}"
            echo "All build/libs JARs:"
            printf '  %s\n' "${candidates[@]:-<none>}"
            exit 1
          fi

          cp "${distributable[0]}" build/artifacts/
          echo "Distributable mod JAR: ${distributable[0]}"

      - name: Upload distributable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: moreminecrafts-stage4-build
          path: build/artifacts/*.jar
          if-no-files-found: error
          retention-days: 14

  server-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Accept Minecraft EULA for CI runtime
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

      - name: Run Fabric server smoke test
        shell: bash
        run: |
          set +e
          timeout 150s gradle runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e

          cat server-smoke.log

          grep -F "Registry probe OK: moreminecrafts:foundation_probe" server-smoke.log
          grep -F "Item registration OK: moreminecrafts:enhancement_stone" server-smoke.log
          grep -F "MoreMinecrafts common initialization complete." server-smoke.log

          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "runServer exited unexpectedly with code $exit_code"
            exit "$exit_code"
          fi

          echo "Server runtime smoke test passed."


  client-smoke:
    runs-on: ubuntu-latest
    needs: server-smoke
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Fabric client smoke test
        shell: bash
        run: |
          set +e
          timeout 180s xvfb-run -a gradle runClient > client-smoke.log 2>&1
          exit_code=$?
          set -e

          cat client-smoke.log

          grep -F "Registry probe OK: moreminecrafts:foundation_probe" client-smoke.log
          grep -F "Item registration OK: moreminecrafts:enhancement_stone" client-smoke.log
          grep -F "MoreMinecrafts common initialization complete." client-smoke.log
          grep -F "MoreMinecrafts client initialization complete." client-smoke.log

          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "runClient exited unexpectedly with code $exit_code"
            exit "$exit_code"
          fi

          echo "Client runtime smoke test passed."
