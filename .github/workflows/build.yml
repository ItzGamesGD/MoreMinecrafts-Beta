name: Fabric CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - "stage-*/**"
      - codex/pr75-research-node-tree-impl
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean test build compileGametestJava runGameTest

      - name: Collect distributable mod JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/artifacts
          shopt -s nullglob
          candidates=(build/libs/*.jar)
          distributable=()

          for jar in "${candidates[@]}"; do
            case "$jar" in
              *-sources.jar|*-dev.jar|*-dev-shadow.jar) continue ;;
            esac
            distributable+=("$jar")
          done

          if [ "${#distributable[@]}" -ne 1 ]; then
            echo "Expected exactly one distributable mod JAR, found ${#distributable[@]}:"
            printf '  %s\n' "${distributable[@]:-<none>}"
            echo "All build/libs JARs:"
            printf '  %s\n' "${candidates[@]:-<none>}"
            exit 1
          fi

          cp "${distributable[0]}" build/artifacts/
          echo "Distributable mod JAR: ${distributable[0]}"

      - name: Upload distributable mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: moreminecrafts-stage4-build
          path: build/artifacts/*.jar
          if-no-files-found: error
          retention-days: 14

  server-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Minecraft EULA for CI runtime
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

      - name: Run Fabric server smoke test
        shell: bash
        run: |
          set +e
          timeout 150s ./gradlew runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e

          cat server-smoke.log

          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "runServer exited unexpectedly with code $exit_code"
            exit "$exit_code"
          fi

          # Require MoreMinecrafts registry/common initialization as well as actual server readiness.
          grep -F "Registry probe OK: moreminecrafts:foundation_probe" server-smoke.log
          grep -F "Item registration OK: moreminecrafts:enhancement_stone" server-smoke.log
          grep -F "MoreMinecrafts common initialization complete." server-smoke.log
          grep -E 'Done \([0-9.]+s\)! For help, type "help"' server-smoke.log

          if grep -Eiq 'Registry loading errors|Unbound values in registry|Failed to load datapacks|Failed to load registries|Registry Loading|Errors in currently selected data packs|Exception in server tick loop|Could not load level' server-smoke.log; then
            echo "Fatal registry/datapack/server startup marker found"
            exit 1
          fi

          echo "Server runtime smoke test passed."


  client-smoke:
    runs-on: ubuntu-latest
    needs: server-smoke
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools

      - name: Run Fabric client smoke test
        shell: bash
        run: |
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" env LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render" env LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe ./gradlew runClient > client-smoke.log 2>&1
          exit_code=$?
          set -e

          cat client-smoke.log

          grep -F "Registry probe OK: moreminecrafts:foundation_probe" client-smoke.log
          grep -F "Item registration OK: moreminecrafts:enhancement_stone" client-smoke.log
          grep -F "MoreMinecrafts common initialization complete." client-smoke.log
          grep -F "MoreMinecrafts client initialization complete." client-smoke.log
          grep -F "Using graphics backend" client-smoke.log
          grep -F "Reloading ResourceManager:" client-smoke.log
          grep -F "minecraft:textures/atlas/items.png-atlas" client-smoke.log

          if grep -F "Failed to create backend OpenGL" client-smoke.log && grep -F "Failed to create backend Vulkan" client-smoke.log; then
            echo "Neither rendering backend was created; client resources were not loaded."
            exit 1
          fi
          if grep -E "Missing texture|Unable to load model|Could not load model|Failed to load texture|Unable to decode|Exception while baking|Unable to stitch" client-smoke.log; then
            echo "Client resource loading reported an error."
            exit 1
          fi

          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "runClient exited unexpectedly with code $exit_code"
            exit "$exit_code"
          fi

          echo "Client runtime smoke test passed."
