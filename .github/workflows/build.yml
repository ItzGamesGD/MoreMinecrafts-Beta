name: Fabric CI

on:
  push:
    branches:
      - main
      - stage-1/fabric-foundation
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: gradle build

  server-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Accept Minecraft EULA for CI runtime
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

      - name: Run Fabric server smoke test
        shell: bash
        run: |
          set +e
          timeout 150s gradle runServer > server-smoke.log 2>&1
          exit_code=$?
          set -e

          cat server-smoke.log

          grep -F "Registry probe OK: moreminecrafts:foundation_probe" server-smoke.log
          grep -F "MoreMinecrafts common initialization complete." server-smoke.log

          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ]; then
            echo "runServer exited unexpectedly with code $exit_code"
            exit "$exit_code"
          fi

          echo "Server runtime smoke test passed."
