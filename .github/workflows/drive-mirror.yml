name: Drive mirror

# Full-fidelity Google Drive mirror of every branch (and tag) of this repository.
# Design, Drive layout and setup runbook: tools/drive_mirror/README.md
#
# Nothing runs until the repository variable DRIVE_MIRROR_ENABLED is "true" and the
# `drive-mirror` environment holds the destination and credentials (see README).
#
# Trust model: Drive credentials are only ever used by the `mirror` job, which only runs in the
# context of the trusted branch (default: main). Events on any other branch or tag run the
# credential-free `relay` job, which asks GitHub to dispatch this workflow on the trusted
# branch. Configure the `drive-mirror` environment to allow deployments from that branch only.
#
# Trigger notes (GitHub semantics):
#   * push / create / pull_request_target only fire for branches whose own tree contains
#     this file; the hourly schedule covers every other branch.
#   * schedule and workflow_dispatch only run the copy of this file on the default branch.
# Every run mirrors the *whole* remote state, never just the event's ref, so collapsed or
# missed events cannot leave gaps.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  create:
  delete:
  pull_request_target:
    types: [opened, reopened, closed, edited, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: "23 * * * *"   # hourly incremental sync
    - cron: "41 3 * * *"   # daily reconcile: crawl every namespace, repair drift, deep-verify a sample
  workflow_dispatch:
    inputs:
      mode:
        description: incremental | reconcile | verify-only | dry-run
        type: choice
        options: [incremental, reconcile, verify-only, dry-run]
        default: incremental
      mirror_name:
        description: Override the mirror root folder name (use a test name for a controlled test namespace)
        type: string
        default: ""
      pull_heads:
        description: Also mirror PR head trees (none | orphaned | all)
        type: choice
        options: [none, orphaned, all]
        default: none
      time_budget_min:
        description: Stop cleanly after this many minutes (the next run resumes)
        type: string
        default: "320"
      break_lock:
        description: Break a stale Drive lease left by a killed run
        type: boolean
        default: false
      allow_mass_retire:
        description: Allow retiring more than 20% of namespaces in one run
        type: boolean
        default: false

# Read-only toward GitHub by default. The mirror never pushes, comments, or edits anything here.
permissions:
  contents: read

jobs:
  relay:
    if: >-
      vars.DRIVE_MIRROR_ENABLED == 'true' &&
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: write   # only to request a workflow_dispatch run; no access to repository contents
    concurrency:
      group: drive-mirror-relay-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Request a sync on the trusted branch
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main' }}
          EVENT: ${{ github.event_name }}
        run: |
          gh workflow run drive-mirror.yml --repo "$GITHUB_REPOSITORY" --ref "$TRUSTED" -f mode=incremental
          echo "Relayed $EVENT on $GITHUB_REF to a sync on $TRUSTED." >> "$GITHUB_STEP_SUMMARY"

  not-configured:
    if: github.event_name == 'workflow_dispatch' && vars.DRIVE_MIRROR_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## Drive mirror: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository variable DRIVE_MIRROR_ENABLED is not 'true'. See tools/drive_mirror/README.md." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Drive mirror is not configured (BLOCKED)"
          exit 1

  mirror:
    if: >-
      vars.DRIVE_MIRROR_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: drive-mirror
    # Single writer: at most one sync executes; newer events queue behind it (a queued run is
    # replaced by a newer one, which is safe because each run syncs the full remote state).
    concurrency:
      group: drive-mirror-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC token for Workload Identity Federation to Google; grants nothing on GitHub
    env:
      PYTHONPATH: ${{ github.workspace }}/tooling/tools
      PYTHONUNBUFFERED: "1"
      REPO_URL: https://github.com/${{ github.repository }}
      INPUT_MIRROR_NAME: ${{ inputs.mirror_name }}
      VAR_MIRROR_NAME: ${{ vars.DRIVE_MIRROR_NAME }}
      MAX_AGE_HOURS: ${{ vars.DRIVE_MIRROR_MAX_AGE_HOURS || '26' }}
      EXPECTED_BYTES: ${{ vars.DRIVE_MIRROR_EXPECTED_BYTES || '13000000000' }}
      DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
      DRIVE_SHARED_DRIVE_ID: ${{ secrets.DRIVE_SHARED_DRIVE_ID }}
      DRIVE_AUTH_MODE: ${{ vars.DRIVE_AUTH_MODE || 'adc' }}
      PULL_HEADS: ${{ inputs.pull_heads || vars.DRIVE_MIRROR_PULL_HEADS || 'none' }}
    steps:
      - name: Mask destination identifiers, resolve mirror name
        run: |
          [ -n "$DRIVE_PARENT_FOLDER_ID" ] && echo "::add-mask::$DRIVE_PARENT_FOLDER_ID"
          [ -n "$DRIVE_SHARED_DRIVE_ID" ] && echo "::add-mask::$DRIVE_SHARED_DRIVE_ID"
          REPORTS="$RUNNER_TEMP/reports"
          mkdir -p "$REPORTS"
          echo "REPORTS=$REPORTS" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/source.git" >> "$GITHUB_ENV"
          name="${INPUT_MIRROR_NAME:-${VAR_MIRROR_NAME:-${GITHUB_REPOSITORY#*/}}}"
          case "$name" in */*|"") echo "::error::invalid mirror name"; exit 1 ;; esac
          echo "MIRROR_NAME=$name" >> "$GITHUB_ENV"

      # This job only runs in the trusted branch's context (for pull_request_target, github.sha is
      # the base branch head), so the tooling below is the trusted branch's copy. Mirrored
      # repository content is only ever read as data by git; nothing from it is executed.
      - name: Check out mirror tooling (trusted ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ vars.DRIVE_MIRROR_TOOLING_REF || github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: tools/drive_mirror
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          mode=incremental
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "41 3 * * *" ]; then mode=reconcile; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then mode="$INPUT_MODE"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode (event: $EVENT)"

      - name: Authenticate to Google (Workload Identity Federation, keyless)
        if: env.DRIVE_AUTH_MODE == 'adc'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install auth library
        if: env.DRIVE_AUTH_MODE == 'adc'
        run: python -m pip install --quiet "google-auth==2.38.0" "requests==2.32.3"

      - name: Configure read-only git access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Passed through the environment (not written to any config file); contents: read only.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $basic"
          } >> "$GITHUB_ENV"

      - name: Preflight (credentials, destination, quota)
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          probe=""
          case "$MODE" in reconcile|verify-only) probe="--write-probe" ;; esac
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && probe="--write-probe"
          python -m drive_mirror preflight --expected-bytes "$EXPECTED_BYTES" $probe --report "$REPORTS/preflight.json"

      - name: Sync
        id: sync
        if: steps.mode.outputs.mode != 'verify-only'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          BUDGET: ${{ inputs.time_budget_min || '320' }}
          BREAK_LOCK: ${{ inputs.break_lock && '--break-lock' || '' }}
          MASS: ${{ inputs.allow_mass_retire && '--allow-mass-retire' || '' }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set +e
          extra=""
          if [ "$MODE" = "dry-run" ]; then extra="--dry-run"; MODE=incremental; fi
          for attempt in 1 2; do
            python -m drive_mirror sync --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
              --mirror-name "$MIRROR_NAME" --mode "$MODE" --pull-heads "$PULL_HEADS" \
              --github-repo "$GITHUB_REPOSITORY" --time-budget-min "$BUDGET" --workers 4 \
              --report "$REPORTS/sync.json" $extra $BREAK_LOCK $MASS
            code=$?
            # Retry once only for a generic failure; lease held / blocked / safety stops are final.
            [ "$code" = "1" ] && [ "$attempt" = "1" ] && { echo "::warning::sync failed, retrying once"; sleep 60; continue; }
            break
          done
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "Sync complete." ;;
            2) echo "::warning::Sync stopped at its time budget; the next run resumes (INCOMPLETE)." ;;
            3) echo "::error::Another writer holds the Drive lease (LOCKED)"; exit 1 ;;
            4) echo "::error::Drive credentials or destination unavailable (BLOCKED)"; exit 1 ;;
            5) echo "::error::Safety stop - see report (SAFETY_STOP)"; exit 1 ;;
            *) echo "::error::Sync failed (exit $code)"; exit 1 ;;
          esac

      - name: Independent verification
        if: steps.sync.outputs.exit == '0' || steps.mode.outputs.mode == 'verify-only' || steps.mode.outputs.mode == 'reconcile'
        env:
          DEEP: ${{ steps.mode.outputs.mode == 'reconcile' && '300' || '0' }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python -m drive_mirror verify --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
            --mirror-name "$MIRROR_NAME" --pull-heads "$PULL_HEADS" --deep-sample "$DEEP" \
            --report "$REPORTS/verify.json"

      - name: Staleness check
        if: always() && steps.mode.outputs.mode != 'dry-run'
        env:
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          python -m drive_mirror status --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
            --mirror-name "$MIRROR_NAME" --max-age-hours "$MAX_AGE_HOURS" \
            --report "$REPORTS/status.json"

      - name: Per-file inventory (reconcile runs)
        if: steps.mode.outputs.mode == 'reconcile'
        run: |
          python -m drive_mirror inventory --repo-url "$REPO_URL" --work-dir "$WORK_DIR" --no-ci \
            --github-repo "$GITHUB_REPOSITORY" --files-out "$REPORTS/inventory-files.jsonl" \
            --report "$REPORTS/inventory.json" > /dev/null
          gzip -9 "$REPORTS/inventory-files.jsonl"

      - name: Job summary
        if: always()
        run: python tooling/tools/drive_mirror/summary.py "$REPORTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-mirror-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/reports
          retention-days: 30
