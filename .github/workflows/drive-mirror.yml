name: Drive mirror

# Full-fidelity Google Drive mirror of every branch (plus PR-only heads and tags) of this repository.
# Design, Drive layout and setup runbook: tools/drive_mirror/README.md
#
# DISABLED BY DEFAULT: nothing runs until the repository variable DRIVE_MIRROR_ENABLED is "true" and
# the `drive-mirror` environment holds the destination and credentials. Do not enable it before the
# controlled live test in the README has been approved.
#
# Trust model: Drive credentials are only ever used by the `mirror` job, which only runs in the
# context of the trusted branch (default: main). Events on any other branch or tag run the
# credential-free `relay` job, which asks GitHub to dispatch this workflow on the trusted branch.
# Configure the `drive-mirror` environment to allow deployments from that branch only.
#
# Trigger notes (GitHub semantics):
#   * push / create / delete / pull_request_target fire only for branches whose own tree contains
#     this file; the hourly schedule covers every other branch.
#   * schedule and workflow_dispatch only run the copy of this file on the default branch.
#   * GitHub disables scheduled workflows in a public repository after 60 days without repository
#     activity. A silent mirror is therefore possible; monitor freshness from outside (see README).
# Every run mirrors the *whole* remote state, never just the event's ref, so collapsed or missed
# events cannot leave gaps.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  create:
  delete:
  pull_request_target:
    types: [opened, reopened, closed, edited, synchronize, ready_for_review, converted_to_draft]
  schedule:
    # Hourly. The daily full reconcile is not scheduled separately: a pending run can be replaced by
    # a newer pending run (concurrency), so a dedicated cron could starve. Each run upgrades itself to
    # a reconcile when the persisted last-reconcile time is older than RECONCILE_AFTER_HOURS.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: incremental | reconcile | verify-only | dry-run
        type: choice
        options: [incremental, reconcile, verify-only, dry-run]
        default: incremental
      mirror_name:
        description: Override the mirror root folder name (use a test name for a controlled test namespace)
        type: string
        default: ""
      pull_heads:
        description: PR head trees to mirror under pulls/ (orphaned = heads no branch contains)
        type: choice
        options: [orphaned, all, none]
        default: orphaned
      time_budget_min:
        description: Stop cleanly after this many minutes (the next run resumes)
        type: string
        default: "270"
      break_lock:
        description: Break a stale Drive lease left by a killed run
        type: boolean
        default: false
      allow_mass_retire:
        description: Allow retiring more than 20% of namespaces in one run
        type: boolean
        default: false

# Read-only toward GitHub by default. The mirror never pushes, comments, or edits anything here.
permissions:
  contents: read

jobs:
  relay:
    if: >-
      vars.DRIVE_MIRROR_ENABLED == 'true' &&
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
      github.ref != format('refs/heads/{0}', vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # only to request a workflow_dispatch run; no access to repository contents
    concurrency:
      group: drive-mirror-relay-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Request a sync on the trusted branch
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED: ${{ vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main' }}
          EVENT: ${{ github.event_name }}
        run: |
          gh workflow run drive-mirror.yml --repo "$GITHUB_REPOSITORY" --ref "$TRUSTED" -f mode=incremental
          echo "Relayed $EVENT on $GITHUB_REF to a sync on $TRUSTED." >> "$GITHUB_STEP_SUMMARY"

  not-configured:
    if: github.event_name == 'workflow_dispatch' && vars.DRIVE_MIRROR_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "## Drive mirror: BLOCKED" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository variable DRIVE_MIRROR_ENABLED is not 'true'. See tools/drive_mirror/README.md." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Drive mirror is not configured (BLOCKED)"
          exit 1

  mirror:
    if: >-
      vars.DRIVE_MIRROR_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', vars.DRIVE_MIRROR_TRUSTED_BRANCH || 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 350        # GitHub-hosted jobs are hard-limited to 360 minutes
    environment: drive-mirror
    # Single writer: at most one sync executes; newer events queue behind it (a queued run is
    # replaced by a newer one, which is safe because each run syncs the full remote state).
    concurrency:
      group: drive-mirror-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC token for Workload Identity Federation to Google; grants nothing on GitHub
    env:
      PYTHONPATH: ${{ github.workspace }}/tooling/tools
      PYTHONUNBUFFERED: "1"
      REPO_URL: https://github.com/${{ github.repository }}
      INPUT_MIRROR_NAME: ${{ inputs.mirror_name }}
      VAR_MIRROR_NAME: ${{ vars.DRIVE_MIRROR_NAME }}
      MAX_AGE_HOURS: ${{ vars.DRIVE_MIRROR_MAX_AGE_HOURS || '26' }}
      RECONCILE_AFTER_HOURS: ${{ vars.DRIVE_MIRROR_RECONCILE_AFTER_HOURS || '24' }}
      EXPECTED_BYTES: ${{ vars.DRIVE_MIRROR_EXPECTED_BYTES || '14000000000' }}
      DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
      DRIVE_SHARED_DRIVE_ID: ${{ secrets.DRIVE_SHARED_DRIVE_ID }}
      DRIVE_AUTH_MODE: ${{ vars.DRIVE_AUTH_MODE || 'adc' }}
      PULL_HEADS: ${{ inputs.pull_heads || vars.DRIVE_MIRROR_PULL_HEADS || 'orphaned' }}
    steps:
      - name: Mask destination identifiers, resolve mirror name
        run: |
          [ -n "$DRIVE_PARENT_FOLDER_ID" ] && echo "::add-mask::$DRIVE_PARENT_FOLDER_ID"
          [ -n "$DRIVE_SHARED_DRIVE_ID" ] && echo "::add-mask::$DRIVE_SHARED_DRIVE_ID"
          REPORTS="$RUNNER_TEMP/reports"
          mkdir -p "$REPORTS"
          echo "REPORTS=$REPORTS" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/source.git" >> "$GITHUB_ENV"
          name="${INPUT_MIRROR_NAME:-${VAR_MIRROR_NAME:-${GITHUB_REPOSITORY#*/}}}"
          case "$name" in */*|"") echo "::error::invalid mirror name"; exit 1 ;; esac
          echo "MIRROR_NAME=$name" >> "$GITHUB_ENV"

      # This job only runs in the trusted branch's context (for pull_request_target, github.sha is
      # the base branch head), so the tooling below is the trusted branch's copy. Mirrored
      # repository content is only ever read as data by git; nothing from it is executed.
      # Third-party actions are pinned to commit SHAs because this job can see Drive credentials.
      - name: Check out mirror tooling (trusted ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ vars.DRIVE_MIRROR_TOOLING_REF || github.sha }}
          path: tooling
          persist-credentials: false
          sparse-checkout: tools/drive_mirror
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          mode=incremental
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_MODE" ]; then mode="$INPUT_MODE"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Requested mode: $mode (event: $EVENT)"

      - name: Authenticate to Google (Workload Identity Federation, keyless)
        if: env.DRIVE_AUTH_MODE == 'adc'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Install auth library
        if: env.DRIVE_AUTH_MODE == 'adc'
        run: python -m pip install --quiet "google-auth==2.38.0" "requests==2.32.3"

      - name: Configure read-only git access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Passed through the environment (not written to any config file); contents: read only.
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $basic"
          } >> "$GITHUB_ENV"

      - name: Preflight (credentials, destination, quota)
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          probe=""
          case "$MODE" in reconcile|verify-only) probe="--write-probe" ;; esac
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && probe="--write-probe"
          python -m drive_mirror preflight --expected-bytes "$EXPECTED_BYTES" $probe --report "$REPORTS/preflight.json"

      # ---- Security gate -------------------------------------------------------------------
      # Frozen-snapshot handoff. `prepare` fetches every ref ONCE and writes the snapshot (ref -> commit and
      # tree ids). The gate scans exactly that snapshot's commits with the same pinned, checksum-verified
      # gitleaks as pre-public-security-scan.yml (--redact=100; only rule, file and commit are ever printed),
      # evaluates every ref of it, and writes the approval, which embeds the snapshot. From here on nothing
      # fetches: sync and verify read the snapshot from the approval and upload only commits the gate
      # examined, so a push that lands after this step cannot reach Drive before the next run's gate sees it.
      # The approval's SHA-256 is recorded as a step output (immutable once the step has finished) and
      # every later step refuses a file that does not match it. Findings not approved in
      # tools/drive_mirror/security/approved_findings.json quarantine exactly the refs whose tip tree would
      # upload the flagged content; every other ref is mirrored. Nothing is suppressed automatically. A
      # scanner that cannot run, or an approval that is missing or invalid, fails the job (fail closed).
      - name: Freeze the source snapshot (single fetch of every ref)
        run: python -m drive_mirror prepare --repo-url "$REPO_URL" --work-dir "$WORK_DIR" --snapshot-out "$REPORTS/source-snapshot.json"

      - name: Install pinned, checksum-verified gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive" -o "$RUNNER_TEMP/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-tool"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks-tool" gitleaks
          echo "$RUNNER_TEMP/gitleaks-tool" >> "$GITHUB_PATH"

      - name: Secret scan and gate
        id: gate
        run: |
          set +e
          python -m drive_mirror secgate --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
            --source-snapshot "$REPORTS/source-snapshot.json" --run-scanner gitleaks \
            --quarantine-out "$REPORTS/approval.json" --report "$REPORTS/secgate.json"
          gate=$?
          echo "exit=$gate" >> "$GITHUB_OUTPUT"
          case "$gate" in
            0) echo "Security gate: PASS" ;;
            6) echo "::warning::Security gate: unapproved findings. Affected refs are quarantined (not uploaded); the rest is mirrored." ;;
            *) echo "::error::Security gate could not decide (exit $gate); refusing to sync (fail closed)"; exit 1 ;;
          esac
          [ -s "$REPORTS/approval.json" ] || { echo "::error::no approval was written; refusing to sync (fail closed)"; exit 1; }
          echo "approval_sha256=$(sha256sum "$REPORTS/approval.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # --------------------------------------------------------------------------------------

      - name: Sync
        id: sync
        if: steps.mode.outputs.mode != 'verify-only'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_SHA256: ${{ steps.gate.outputs.approval_sha256 }}
          BUDGET: ${{ inputs.time_budget_min || '270' }}
          BREAK_LOCK: ${{ inputs.break_lock && '--break-lock' || '' }}
          MASS: ${{ inputs.allow_mass_retire && '--allow-mass-retire' || '' }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set +e
          extra=""
          if [ "$MODE" = "dry-run" ]; then extra="--dry-run"; MODE=incremental; fi
          for attempt in 1 2; do
            python -m drive_mirror sync --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
              --mirror-name "$MIRROR_NAME" --mode "$MODE" --pull-heads "$PULL_HEADS" \
              --reconcile-after-hours "$RECONCILE_AFTER_HOURS" --quarantine-file "$REPORTS/approval.json" \
              --approval-sha256 "$APPROVAL_SHA256" \
              --github-repo "$GITHUB_REPOSITORY" --time-budget-min "$BUDGET" --workers 4 \
              --report "$REPORTS/sync.json" $extra $BREAK_LOCK $MASS
            code=$?
            # Retry once only for a generic failure; lease held / blocked / safety stops are final.
            [ "$code" = "1" ] && [ "$attempt" = "1" ] && { echo "::warning::sync failed, retrying once"; sleep 60; continue; }
            break
          done
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "Sync complete." ;;
            2) echo "::warning::Sync stopped at its time budget; the next run resumes (INCOMPLETE)." ;;
            3) echo "::error::Another writer holds the Drive lease (LOCKED)"; exit 1 ;;
            7) echo "::error::Approved snapshot missing, invalid or no longer matching the local cache (GATE MISMATCH): nothing was uploaded; the next run gates afresh"; exit 1 ;;
            4) echo "::error::Drive credentials or destination unavailable (BLOCKED)"; exit 1 ;;
            5) echo "::error::Safety stop - see report (SAFETY_STOP)"; exit 1 ;;
            *) echo "::error::Sync failed (exit $code)"; exit 1 ;;
          esac

      # Incremental runs verify bytes only for the namespaces they changed (cheap structural checks
      # for the rest); a reconcile run, or a failed/unfinished one, is verified in full.
      # A dry run writes nothing, so a never-synced (test) namespace does not exist yet and there is
      # nothing to verify: running `verify` after it would fail with `mirror_root` and turn the
      # documented first step of the controlled live test red.
      - name: Independent verification
        if: (steps.sync.outputs.exit == '0' && steps.mode.outputs.mode != 'dry-run') || steps.mode.outputs.mode == 'verify-only'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          APPROVAL_SHA256: ${{ steps.gate.outputs.approval_sha256 }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          scope=""
          deep=0
          if [ "$MODE" = "verify-only" ] || [ "$MODE" = "reconcile" ]; then
            deep=300
          elif [ -f "$REPORTS/sync.json" ]; then
            effective=$(python -c 'import json,sys;print(json.load(open(sys.argv[1])).get("mode",""))' "$REPORTS/sync.json")
            if [ "$effective" = "reconcile" ]; then deep=300; else scope="--sync-report $REPORTS/sync.json"; fi
          fi
          python -m drive_mirror verify --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
            --mirror-name "$MIRROR_NAME" --pull-heads "$PULL_HEADS" --deep-sample "$deep" \
            --quarantine-file "$REPORTS/approval.json" --approval-sha256 "$APPROVAL_SHA256" $scope --report "$REPORTS/verify.json"

      - name: Staleness check
        if: always() && steps.mode.outputs.mode != 'dry-run'
        env:
          APPROVAL_SHA256: ${{ steps.gate.outputs.approval_sha256 }}
          DRIVE_OAUTH_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_CLIENT_ID }}
          DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.DRIVE_OAUTH_CLIENT_SECRET }}
          DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          q=""
          [ -f "$REPORTS/approval.json" ] && q="--quarantine-file $REPORTS/approval.json --approval-sha256 $APPROVAL_SHA256"
          python -m drive_mirror status --repo-url "$REPO_URL" --work-dir "$WORK_DIR" \
            --mirror-name "$MIRROR_NAME" --max-age-hours "$MAX_AGE_HOURS" $q --report "$REPORTS/status.json"

      - name: Per-file inventory (reconcile runs)
        if: steps.mode.outputs.mode == 'reconcile'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m drive_mirror inventory --repo-url "$REPO_URL" --work-dir "$WORK_DIR" --no-ci \
            --github-repo "$GITHUB_REPOSITORY" --files-out "$REPORTS/inventory-files.jsonl" \
            --report "$REPORTS/inventory.json" > /dev/null
          gzip -9 "$REPORTS/inventory-files.jsonl"

      - name: Job summary
        if: always()
        run: python tooling/tools/drive_mirror/summary.py "$REPORTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drive-mirror-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/reports
          retention-days: 30
