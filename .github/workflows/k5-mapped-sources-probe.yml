name: K5 Mapped Sources Probe

on:
  pull_request:
    paths:
      - '.github/workflows/k5-mapped-sources-probe.yml'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'src/gametest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapped-sources:
    name: Resolve Minecraft 26.3 mapped sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve mapped sources
        shell: bash
        run: |
          set -o pipefail
          ./gradlew genSources --stacktrace --no-daemon 2>&1 | tee k5-gensources.log
      - name: Inspect only tree-generation API signatures
        shell: bash
        run: |
          python3 - <<'PY' | tee k5-mapped-api-report.txt
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          targets = {
              "net.minecraft.world.level.chunk.ChunkGenerator": ["applyBiomeDecoration"],
              "net.minecraft.world.level.chunk.ChunkAccess": ["getPos", "getSection", "getSections", "fillBiomesFromNoise"],
              "net.minecraft.world.level.chunk.LevelChunkSection": ["setBiome", "getNoiseBiome"],
              "net.minecraft.resources.ResourceKey": ["identifier", "location", "registry"],
              "net.minecraft.resources.Identifier": ["getNamespace", "namespace", "getPath", "path"],
              "net.minecraft.core.Registry": ["getKey", "getResourceKey", "get", "getHolderOrThrow"],
              "net.minecraft.world.level.levelgen.FlatLevelSource": ["getBiomeGenerationSettings"],
              "net.minecraft.world.level.biome.BiomeGenerationSettings": ["features", "getFeatures"],
              "net.minecraft.world.level.biome.FixedBiomeSource": ["FixedBiomeSource", "possibleBiomes"],
              "net.minecraft.world.level.biome.BiomeSource": ["possibleBiomes"],
              "net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator": ["NoiseBasedChunkGenerator"],
              "net.minecraft.world.level.levelgen.NoiseGeneratorSettings": ["OVERWORLD"],
              "net.minecraft.world.level.levelgen.feature.FeatureSorter": ["buildFeaturesPerStep"],
              "net.minecraft.world.level.WorldGenRegion": ["WorldGenRegion", "getBiome", "getChunk"],
              "net.minecraft.world.level.levelgen.placement.FeaturePlacer": ["FeaturePlacer", "placeWithBiomeCheck"],
              "net.minecraft.core.registries.Registries": ["FEATURE", "PLACED_FEATURE", "BIOME", "NOISE_SETTINGS"],
              "net.minecraft.world.level.levelgen.feature.Feature": ["place", "codec"],
              "net.minecraft.world.level.chunk.storage.ChunkSerializer": ["write", "read"],
              "net.minecraft.server.level.ChunkMap": ["saveAllChunks", "save", "scheduleUnload", "scheduleChunkLoad", "readChunk", "prepareAccessibleChunk", "updateChunkScheduling"],
              "net.minecraft.world.level.chunk.storage.ChunkStorage": ["read", "write", "readSync", "write"],
              "net.minecraft.world.level.chunk.ChunkMap": ["save", "prepareAccessibleChunk", "readChunk", "write"],
              "net.minecraft.server.level.ServerChunkCache": ["save", "getChunkFuture", "addRegionTicket", "removeRegionTicket", "addTicketWithRadius", "removeTicketWithRadius", "getVisibleChunkIfPresent", "runDistanceManagerUpdates"],
              "net.minecraft.server.level.DistanceManager": ["addRegionTicket", "removeRegionTicket", "runAllUpdates"],
              "net.minecraft.server.level.ChunkLevel": ["FULL_CHUNK_LEVEL", "byStatus"],
              "net.minecraft.server.level.TicketType": ["FORCED", "UNKNOWN", "create"],
              "net.minecraft.gametest.framework.GameTestHelper": ["runAtTick", "runAfterDelay", "runAtTickTime", "succeedWhen", "startSequence"],
              "net.minecraft.gametest.framework.GameTestSequence": ["thenExecuteAfterDelay", "thenExecute", "thenWaitUntil", "thenFail", "thenSucceed"],
              "net.minecraft.server.level.ChunkHolder": ["getSaveSyncFuture", "getLatestChunk", "getFullChunkNow"],
              "net.minecraft.world.level.chunk.storage.SerializableChunkData": ["parse", "copyOf", "write"],
              "net.minecraft.server.level.ServerLevel": ["unload", "getChunkSource"],
              "net.minecraft.world.level.chunk.LevelChunk": ["getPos", "setUnsaved", "isUnsaved"],
              "net.minecraft.world.level.levelgen.placement.PlacedFeature": ["feature", "place"],
              "net.minecraft.world.level.levelgen.feature.configurations.ConfiguredFeature": ["feature", "place"],
              "net.minecraft.world.level.levelgen.feature.Feature": ["getSubFeatures"],
              "net.minecraft.world.level.levelgen.placement.PlacedFeature": ["place", "placeWithBiomeCheck"],
              "net.minecraft.world.level.levelgen.placement.FeaturePlacer": ["place", "placeWithBiomeCheck"],
              "net.minecraft.world.level.levelgen.feature.Feature": ["place"],
              "net.minecraft.world.level.levelgen.feature.TreeFeature": ["place", "doPlace"],
              "net.minecraft.world.level.levelgen.feature.trunkplacers.MegaPineTrunkPlacer": ["MegaPineTrunkPlacer", "placeTrunk", "getTreeHeight"],
              "net.minecraft.world.level.block.grower.TreeGrower": ["growTree", "getConfiguredFeature"],
              "net.minecraft.world.level.block.SaplingBlock": ["advanceTree", "randomTick", "performBonemeal"],
              "net.minecraft.world.level.WorldGenLevel": ["getChunk", "setBlock", "setCurrentlyGenerating", "getCurrentlyGenerating"],
              "net.minecraft.world.level.LevelWriter": ["setBlock"],
              "net.fabricmc.fabric.api.attachment.v1.AttachmentRegistry": ["create"],
              "net.fabricmc.fabric.api.attachment.v1.AttachmentTarget": ["getAttached", "setAttached", "removeAttached"],
          }
          roots = [Path(".gradle"), Path.home() / ".gradle/caches/fabric-loom", Path.home() / ".gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api"]
          jars = sorted({p for root in roots if root.exists() for p in root.rglob("*.jar")})
          class_jars, source_jars = {}, {}
          dynamic_basenames = {"PlacedFeature.class", "ConfiguredFeature.class", "FeaturePlacer.class", "MegaPineTrunkPlacer.class", "AttachmentType.class", "AttachmentTarget.class", "ChunkAttachment.class", "ChunkDataAttachment.class", "ChunkSerializer.class", "ChunkStorage.class", "ChunkMap.class", "SerializableChunkData.class", "ChunkHolder.class", "ServerChunkCache.class", "ServerLevel.class", "LevelChunk.class", "DistanceManager.class", "TicketType.class", "ChunkLevel.class", "GameTestHelper.class", "GameTestSequence.class"}
          trunk_placer_prefix = "net/minecraft/world/level/levelgen/feature/trunkplacers/"
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as archive:
                      names = set(archive.namelist())
                      for name in targets:
                          entry = name.replace(".", "/")
                          if entry + ".class" in names:
                              class_jars.setdefault(name, jar)
                          if entry + ".java" in names:
                              source_jars.setdefault(name, (jar, entry + ".java"))
                      for entry in names:
                          basename = entry.rsplit("/", 1)[-1]
                          is_trunk_placer = entry.startswith(trunk_placer_prefix) and basename.endswith("TrunkPlacer.class")
                          if entry.endswith(".class") and (basename in dynamic_basenames or is_trunk_placer):
                              name = entry[:-6].replace("/", ".")
                              class_jars.setdefault(name, jar)
                              source_entry = entry[:-6] + ".java"
                              if source_entry in names:
                                  source_jars.setdefault(name, (jar, source_entry))
              except (OSError, zipfile.BadZipFile):
                  continue

          report = []
          dynamic_classes = set(class_jars) - set(targets)
          for name in sorted(set(targets) | dynamic_classes):
              method_names = targets.get(name, ["placeTrunk", "getTreeHeight", "getType", "TrunkPlacer"])
              report.append(f"CLASS {name}")
              jar = class_jars.get(name)
              if jar:
                  out = subprocess.run(["javap", "-classpath", str(jar), "-p", "-s", name], text=True, capture_output=True, check=True).stdout.splitlines()
                  if name.endswith("TicketType"):
                      report.extend(f"  MEMBER {line.strip()}" for line in out if "UNKNOWN" in line or "FORCED" in line or "TicketType(" in line or "create(" in line)
                  if name.endswith("ChunkAccess"):
                      report.append(f"  DECLARATION {out[0].strip() if out else '<missing>'}")
                  for i, line in enumerate(out):
                      if any(re.search(rf"\b{method}\s*\(", line) for method in method_names):
                          descriptor = out[i + 1].strip() if i + 1 < len(out) else "<descriptor missing>"
                          report.append(f"  {line.strip()} | {descriptor}")
                  if name.endswith("TreeFeature"):
                      code = subprocess.run(["javap", "-classpath", str(jar), "-p", "-c", name], text=True, capture_output=True, check=True).stdout.splitlines()
                      for i, line in enumerate(code):
                          if "setBlock:" in line:
                              report.append(f"  BYTECODE {line.strip()}")
                              if i + 1 < len(code):
                                  report.append(f"  BYTECODE {code[i + 1].strip()}")
              else:
                  report.append("  CLASS FILE NOT FOUND IN GENERATED MAPPED JARS")
              source = source_jars.get(name)
              if source:
                  archive_path, entry = source
                  with zipfile.ZipFile(archive_path) as archive:
                      lines = archive.read(entry).decode("utf-8", "replace").splitlines()
                  if name.endswith("ServerChunkCache"):
                      matches = [i for i, line in enumerate(lines) if "addTicketWithRadius" in line or "removeTicketWithRadius" in line]
                  elif name.endswith(("GameTestHelper", "GameTestSequence")):
                      matches = [i for i, line in enumerate(lines) if any(method in line and "(" in line for method in method_names)]
                  else:
                      matches = [i for i, line in enumerate(lines) if any(re.search(rf"\b{method}\s*\(", line) for method in method_names) or any(token in line for token in ("placeWithBiomeCheck", "getConfiguredFeature", "configuredFeature.place(", ".place(")) or (name.endswith("TicketType") and ("UNKNOWN" in line or "FORCED" in line or "create(" in line))]
                  emitted = set()
                  for match in matches:
                      radius = 10 if "placeWithBiomeCheck" in lines[match] else 2
                      after = 18 if name.endswith(("SaplingBlock", "TreeGrower")) else 4
                      for i in range(max(0, match - radius), min(len(lines), match + after)):
                          if i not in emitted:
                              report.append(f"  SOURCE {entry}:{i + 1}: {lines[i].strip()}")
                              emitted.add(i)
                      if len(emitted) >= 80:
                          report.append("  SOURCE CONTEXT TRUNCATED AT 80 LINES")
                          break
              else:
                  report.append("  SOURCE FILE NOT FOUND IN GENERATED MAPPED JARS")
          print("\n".join(report))
          if not class_jars:
              raise SystemExit("No generated mapped Minecraft class jars were found")
          PY
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-mapped-api-report
          path: |
            k5-gensources.log
            k5-mapped-api-report.txt
          if-no-files-found: warn
          retention-days: 14
