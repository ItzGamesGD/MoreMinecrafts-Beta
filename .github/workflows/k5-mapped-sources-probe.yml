name: K5 Mapped Sources Probe

on:
  pull_request:
    paths:
      - '.github/workflows/k5-mapped-sources-probe.yml'
      - 'gradle.properties'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapped-sources:
    name: Resolve Minecraft 26.3 mapped sources
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve mapped sources
        shell: bash
        run: |
          set -o pipefail
          ./gradlew genSources --stacktrace --no-daemon 2>&1 | tee k5-gensources.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-gensources-diagnostic
          path: k5-gensources.log
          if-no-files-found: warn
          retention-days: 14
