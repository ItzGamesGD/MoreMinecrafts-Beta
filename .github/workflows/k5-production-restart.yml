name: K5 Production Restart

on:
  pull_request:
    paths:
      - '.github/workflows/k5-production-restart.yml'
      - 'src/main/**'
      - 'src/gametest/**'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persisted-k5:
    name: Two-process chunk and player persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile GameTests
        run: ./gradlew compileGametestJava --no-daemon
      - name: Process A saves natural markers and K5 progress
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:k5natural_tree_probe_game_tests_k5natural_chunk_provenance_survives_real_save_unload_reload_and_invalidation
            -Dmoreminecrafts.k5.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee k5-restart-write.log
          grep -F 'K5_RESTART_WRITE' k5-restart-write.log
      - name: Process B reloads the same world and player from disk
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:k5natural_tree_probe_game_tests_k5natural_chunk_provenance_survives_real_save_unload_reload_and_invalidation
            -Dmoreminecrafts.k5.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee k5-restart-read.log
          grep -F 'K5_RESTART_READ' k5-restart-read.log
      - name: Process A saves XP Quest ore provenance
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_ore_restart_game_tests_ore_provenance_survives_real_save_unload_and_reload
            -Dmoreminecrafts.questore.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-ore-restart-write.log
          grep -F 'QUEST_ORE_RESTART_WRITE' quest-ore-restart-write.log
      - name: Process B reloads XP Quest ore provenance from disk
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_ore_restart_game_tests_ore_provenance_survives_real_save_unload_and_reload
            -Dmoreminecrafts.questore.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-ore-restart-read.log
          grep -F 'QUEST_ORE_RESTART_READ' quest-ore-restart-read.log
      - name: Process A saves Q1-C structure loot evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_loot_restart_game_tests_structure_loot_persists_across_clean_jvms
            -Dmoreminecrafts.questloot.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-loot-restart-write.log
          grep -F 'QUEST_LOOT_RESTART_WRITE' quest-loot-restart-write.log
      - name: Process B reloads Q1-C structure loot and player evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_loot_restart_game_tests_structure_loot_persists_across_clean_jvms
            -Dmoreminecrafts.questloot.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-loot-restart-read.log
          grep -F 'QUEST_LOOT_RESTART_READ' quest-loot-restart-read.log
      - name: Process A saves Q1-C vault evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_vault_restart_game_tests_vault_evidence_survives_reload_unload_and_restart
            -Dmoreminecrafts.questvault.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-vault-restart-write.log
          grep -F 'QUEST_VAULT_RESTART_WRITE' quest-vault-restart-write.log
      - name: Process B reloads Q1-C vault chunk and player evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_vault_restart_game_tests_vault_evidence_survives_reload_unload_and_restart
            -Dmoreminecrafts.questvault.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-vault-restart-read.log
          grep -F 'QUEST_VAULT_RESTART_READ' quest-vault-restart-read.log
      - name: Process A saves Q1-C structure entry evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_structure_restart_game_tests_structure_entry_persists_across_clean_jvms
            -Dmoreminecrafts.questcity.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-city-restart-write.log
          grep -F 'QUEST_CITY_RESTART_WRITE' quest-city-restart-write.log
      - name: Process B reloads Q1-C structure entry evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_structure_restart_game_tests_structure_entry_persists_across_clean_jvms
            -Dmoreminecrafts.questcity.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-city-restart-read.log
          grep -F 'QUEST_CITY_RESTART_READ' quest-city-restart-read.log
      - name: Process A saves Q1-C combat kill evidence
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_combat_restart_game_tests_kill_evidence_survives_rejoin_and_clean_restart
            -Dmoreminecrafts.questcombat.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-combat-restart-write.log
          grep -F 'QUEST_COMBAT_RESTART_WRITE' quest-combat-restart-write.log
      - name: Process B reloads Q1-C combat statistics and counters
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_combat_restart_game_tests_kill_evidence_survives_rejoin_and_clean_restart
            -Dmoreminecrafts.questcombat.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-combat-restart-read.log
          grep -F 'QUEST_COMBAT_RESTART_READ' quest-combat-restart-read.log
      - name: Process A saves Q1-C dragon rematch credit
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_dragon_rematch_game_tests_rematch_credit*
            -Dmoreminecrafts.questdragon.restart.phase=write
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-dragon-restart-write.log
          grep -F 'QUEST_DRAGON_RESTART_WRITE' quest-dragon-restart-write.log
      - name: Process B reloads Q1-C dragon rematch credit
        env:
          JAVA_TOOL_OPTIONS: >-
            -Dfabric-api.gametest.filter=moreminecrafts-gametest:quest_dragon_rematch_game_tests_rematch_credit*
            -Dmoreminecrafts.questdragon.restart.phase=read
        run: |
          set -o pipefail
          ./gradlew runGameTest --no-daemon 2>&1 | tee quest-dragon-restart-read.log
          grep -F 'QUEST_DRAGON_RESTART_READ' quest-dragon-restart-read.log
      - name: Upload focused logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k5-production-restart-evidence
          path: |
            k5-restart-write.log
            k5-restart-read.log
            build/run/gameTest/k5-restart-fixture.txt
            quest-ore-restart-write.log
            quest-ore-restart-read.log
            build/run/gameTest/quest-ore-restart-fixture.txt
            quest-loot-restart-write.log
            quest-loot-restart-read.log
            quest-vault-restart-write.log
            quest-vault-restart-read.log
            quest-city-restart-write.log
            quest-city-restart-read.log
            quest-combat-restart-write.log
            quest-combat-restart-read.log
            quest-dragon-restart-write.log
            quest-dragon-restart-read.log
          if-no-files-found: warn
          retention-days: 14
