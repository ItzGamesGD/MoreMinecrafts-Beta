name: Piglin Trade Client Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "checkpoint/grand-unified-*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/piglin-trade-client-validation.yml"
      - "src/main/java/dev/itzgamesgd/moreminecrafts/trade/**"
      - "src/main/java/dev/itzgamesgd/moreminecrafts/mixin/MerchantMenuPiglinSoundMixin.java"
      - "src/main/resources/data/moreminecrafts/piglin_trade/**"
      - "src/main/java/dev/itzgamesgd/moreminecrafts/test/LiveTestCommand.java"

permissions:
  contents: read

jobs:
  piglin-trade-client-validation:
    name: piglin-trade-client-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install display and screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1

      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 3
          DISPLAY=:99 openbox --sm-disable > /tmp/openbox.log 2>&1 &
          sleep 2

      - name: Prepare isolated test server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run visual-validation-results
          printf 'eula=true\n' > run/eula.txt
          RCON_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$RCON_PASSWORD"
          cat > run/server.properties <<EOF
          level-name=piglin-validation-world
          level-seed=2632026
          server-ip=127.0.0.1
          server-port=25565
          online-mode=false
          white-list=false
          enforce-whitelist=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=$RCON_PASSWORD
          spawn-protection=0
          spawn-radius=0
          max-players=2
          motd=MoreMinecrafts piglin trade validation
          EOF
          echo "RCON_PASSWORD=$RCON_PASSWORD" >> "$GITHUB_ENV"

      - name: Start server and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          MOREMINECRAFTS_VISUAL_VALIDATION=1 setsid timeout 900s ./gradlew -I scripts/visual_validation/visual-validation.init.gradle runServer --args="--safeMode" > visual-validation-results/server.log 2>&1 &
          for attempt in $(seq 1 150); do
            if grep -Fq "Done (" visual-validation-results/server.log; then
              echo "server ready"; exit 0
            fi
            sleep 2
          done
          tail -n 80 visual-validation-results/server.log
          echo "Server did not become ready."
          exit 1

      - name: Start client and join
        shell: bash
        run: |
          set -euo pipefail
          # Same auto-join path as the existing visual harness (quick-play args do not connect on 26.3).
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
            MOREMINECRAFTS_VISUAL_VALIDATION=1 MOREMINECRAFTS_VISUAL_SERVER_ADDRESS=127.0.0.1:25565 \
            setsid timeout 420s ./gradlew -I scripts/visual_validation/visual-validation.init.gradle runClient \
            --args="--width 1280 --height 720 --username PiglinTester" \
            > visual-validation-results/client.log 2>&1 &
          for attempt in $(seq 1 120); do
            if grep -Fq "VISUAL_VALIDATION_PLAYER_JOINED" visual-validation-results/client.log \
                && grep -Fq "PiglinTester joined the game" visual-validation-results/server.log; then
              echo "client joined"; exit 0
            fi
            sleep 2
          done
          tail -n 80 visual-validation-results/client.log
          echo "Client did not join the server."
          exit 1

      - name: Build the scene and open the structured trade
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/visual_validation/rcon.py \
            "setworldspawn 0 64 0" \
            "time set noon" \
            "weather clear 1000000" \
            "gamemode survival PiglinTester" \
            "give PiglinTester minecraft:gold_block 128" \
            "give PiglinTester minecraft:netherite_ingot 2" \
            "give PiglinTester minecraft:gold_ingot 4" \
            "tp PiglinTester 0 64 0" \
            "summon minecraft:piglin 0 64 3" \
            "mmtest piglin status" \
            "execute as PiglinTester run mmtest piglin unlock"
          sleep 3
          python3 scripts/visual_validation/rcon.py "execute as PiglinTester run mmtest piglin open"
          sleep 4
          DISPLAY=:99 scrot visual-validation-results/piglin-trade.png
          sleep 1
          python3 scripts/visual_validation/rcon.py "execute as PiglinTester run mmtest piglin open" || true

      - name: Assert server-side results
        shell: bash
        run: |
          set -euo pipefail
          log=visual-validation-results/server.log
          grep -Fq "PIGLIN_TRADE_TEST status offers=23 unlock=piglin_trading" "$log" \
            || { echo "catalog did not load 23 offers"; grep "PIGLIN_TRADE_TEST" "$log" || true; exit 1; }
          grep -Fq "PIGLIN_TRADE_TEST unlocked player=PiglinTester" "$log" || { echo "unlock not applied"; exit 1; }
          grep -Fq "PIGLIN_TRADE_TEST open result=OPENED menu=MerchantMenu" "$log" \
            || { echo "structured trade did not open on the server"; grep "PIGLIN_TRADE_TEST" "$log" || true; exit 1; }
          test -s visual-validation-results/piglin-trade.png || { echo "no client screenshot"; exit 1; }
          echo "server-side assertions passed"
          grep "PIGLIN_TRADE_TEST" "$log"

      - name: Stop server and client
        if: always()
        run: |
          pkill -f "runServer" || true
          pkill -f "runClient" || true
          pkill -f "Xvfb :99" || true

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piglin-trade-client-validation-${{ github.run_id }}
          path: visual-validation-results/
          if-no-files-found: warn
          retention-days: 14
