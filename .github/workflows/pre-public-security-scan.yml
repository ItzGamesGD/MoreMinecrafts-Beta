name: Pre-public full-history secret audit

on:
  push:
    branches:
      - main
      - security/pre-public-hardening-20261012
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pre-public-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    name: full-history-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git fetch --force origin '+refs/pull/*/head:refs/remotes/audit-pr-heads/*'
          echo "Pull request refs: $(git for-each-ref --format='%(refname)' refs/remotes/audit-pr-heads | wc -l)"
          echo "Remote branches: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          echo "Tags: $(git for-each-ref --format='%(refname)' refs/tags | wc -l)"
          echo "Reachable commits: $(git rev-list --all --count)"

      - name: Install pinned and checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive" \
            -o "/tmp/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/$archive" | sha256sum -c -
          mkdir -p /tmp/gitleaks-tool
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks-tool gitleaks
          echo /tmp/gitleaks-tool >> "$GITHUB_PATH"

      - name: Scan all reachable Git history without exposing matched values
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/moreminecrafts-full-history-findings.json
          set +e
          gitleaks git --no-banner --no-color --redact=100 \
            --log-opts='--all --full-history' \
            --report-format json --report-path "$report" .
          status=$?
          set -e
          python3 - "$report" "$status" <<'PY'
          import json
          import pathlib
          import sys
          report = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          findings = json.loads(report.read_text()) if report.exists() else []
          findings = findings or []
          print(f"Gitleaks result: exit={status}, findings={len(findings)}")
          print("Matched values, content lines, and full reports are deliberately not published.")
          for item in findings[:100]:
              print("rule={0} file={1} commit={2}".format(
                  item.get("RuleID", "unknown"),
                  item.get("File", "unknown"),
                  item.get("Commit", "unknown"),
              ))
          if len(findings) > 100:
              print(f"Additional findings omitted: {len(findings) - 100}")
          PY
          exit "$status"

  artifacts-inventory:
    # Inventory is an explicit audit step, not an every-PR requirement.
    if: github.event_name == 'workflow_dispatch'
    name: actions-artifact-inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Inventory all Actions artifacts without downloading their contents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import os
          import urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          page = 1
          records = []
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as res:
                  obj = json.load(res)
              records += obj.get("artifacts", [])
              if len(obj.get("artifacts", [])) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError("Artifact list pagination safety limit exceeded")
          live = [item for item in records if not item.get("expired")]
          categories = collections.Counter(item["name"].split("-")[0] for item in live)
          print(f"All artifacts: {len(records)}, unexpired: {len(live)}, expired: {len(records) - len(live)}")
          print(f"Total remaining artifact bytes: {sum(int(item.get('size_in_bytes') or 0) for item in live)}")
          print("Live artifact name-prefix counts: " + json.dumps(dict(categories), sort_keys=True))
          print("These are metadata counts only, not proof of harmless artifact contents.")
          PY

  exposure-audit:
    # Expensive full archive audit is on demand, not every push.
    if: github.event_name == 'workflow_dispatch'
    name: actions-exposure-audit
    runs-on: ubuntu-latest
    # Full retained artifacts and logs are paced to avoid GitHub REST secondary limits.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout the audit script
        uses: actions/checkout@v4
      - name: Scan all retained artifact archives and accessible workflow logs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EXPOSURE_AUDIT_TOKEN || github.token }}
          AUDIT_TOKEN_SOURCE: ${{ secrets.EXPOSURE_AUDIT_TOKEN != '' && 'EXPOSURE_AUDIT_TOKEN' || 'GITHUB_TOKEN' }}
        run: python3 scripts/security/audit_actions_exposure.py
