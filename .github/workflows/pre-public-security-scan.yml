name: Pre-public full-history secret audit

on:
  push:
    branches:
      - security/pre-public-hardening-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-history-secret-scan:
    name: full-history-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          echo "Remote branches: $(git for-each-ref --format='%(refname)' refs/remotes/origin | wc -l)"
          echo "Tags: $(git for-each-ref --format='%(refname)' refs/tags | wc -l)"
          echo "Reachable commits: $(git rev-list --all --count)"

      - name: Install pinned and checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/$archive" \
            -o "/tmp/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/$archive" | sha256sum -c -
          mkdir -p /tmp/gitleaks-tool
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks-tool gitleaks
          echo /tmp/gitleaks-tool >> "$GITHUB_PATH"

      - name: Scan all reachable Git history without exposing matched values
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/moreminecrafts-full-history-findings.json
          set +e
          gitleaks git --no-banner --no-color --redact=100 \
            --log-opts='--all --full-history' \
            --report-format json --report-path "$report" .
          status=$?
          set -e
          python3 - "$report" "$status" <<'PY'
          import json
          import pathlib
          import sys
          report = pathlib.Path(sys.argv[1])
          status = int(sys.argv[2])
          findings = json.loads(report.read_text()) if report.exists() else []
          findings = findings or []
          print(f"Gitleaks result: exit={status}, findings={len(findings)}")
          print("Matched values, content lines, and full reports are deliberately not published.")
          for item in findings[:100]:
              print("rule={0} file={1} commit={2}".format(
                  item.get("RuleID", "unknown"),
                  item.get("File", "unknown"),
                  item.get("Commit", "unknown"),
              ))
          if len(findings) > 100:
              print(f"Additional findings omitted: {len(findings) - 100}")
          PY
          exit "$status"
