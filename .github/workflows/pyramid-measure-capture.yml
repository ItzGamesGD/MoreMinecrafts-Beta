name: Pyramid Measure Client Capture

on:
  push:
    branches:
      - claude/pyramid-measure-20261115
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyramid-client-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 pillow
      - name: Install Xvfb and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
      - name: Generate natural pyramid scan on a real server
        run: tools/st01-p8c2b/run_validation.sh 1004 10240
      - name: Render exterior and royal hall from natural generation
        run: tools/st01-p8c2b/run_client_capture.sh build/st01-p8c2b/results/1004/scan.json 1
      - name: Render controlled pyramid exterior and interior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pyramid-measure/captures
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-client-gametest']=['dev.itzgamesgd.moreminecrafts.pyramid.St01PyramidAssemblyClientCaptureTest']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export JAVA_TOOL_OPTIONS='-Dmm.st01.assembly.client=true'
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [[ -n "$icd" ]]; then export VK_ICD_FILENAMES="$icd"; fi
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -euo pipefail -c '
            openbox --sm-disable > build/pyramid-measure/openbox.log 2>&1 &
            trap "kill $! 2>/dev/null || true" EXIT
            ./gradlew runClientGameTest --args="--width 1280 --height 720" --no-daemon --max-workers=2 2>&1 | tee build/pyramid-measure/client.log
          '
          grep -q 'ST01_P8C2A_CLIENT_CAPTURE_DONE' build/pyramid-measure/client.log
      - name: Collect, resize and quantize captures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          out=Path('docs/captures/pyramid_measure'); out.mkdir(parents=True,exist_ok=True)
          sources=list(Path('.').rglob('*st01-p8c2a-*.png'))+list(Path('build/st01-p8c2b/client/captures').glob('*.png'))
          assert sources, 'No pyramid screenshots found'
          for src in sources:
              im=Image.open(src).convert('RGB')
              if im.size != (1280,720): im=im.resize((1280,720),Image.Resampling.LANCZOS)
              im.quantize(colors=256,method=Image.Quantize.MEDIANCUT).save(out/src.name,optimize=True)
          shutil.copy2('build/pyramid-measure/client.log',out/'client.log')
          natural=Path('build/st01-p8c2b/client/client.log')
          if natural.exists(): shutil.copy2(natural,out/'natural-client.log')
          print('\n'.join(str(p) for p in sorted(out.iterdir())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyramid-measure-captures
          path: docs/captures/pyramid_measure/
          if-no-files-found: warn
