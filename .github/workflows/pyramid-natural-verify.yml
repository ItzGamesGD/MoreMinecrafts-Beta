name: Pyramid Natural Generation Verify

on:
  push:
    branches:
      - claude/pyramid-natural-verify-20261116
  workflow_dispatch:

permissions:
  contents: write

jobs:
  natural-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Install Xvfb and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1
      - name: Isolate verify client entrypoint
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          d=json.loads(p.read_text())
          d['entrypoints']['fabric-client-gametest']=['dev.itzgamesgd.moreminecrafts.pyramid.St01NaturalVerifyClientTest']
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
      - name: Natural generation verify (generator, locate, structure, capture)
        shell: bash
        run: |
          mkdir -p build/pyramid-natural-verify
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export JAVA_TOOL_OPTIONS='-Dmm.pyramid.natural.verify=true'
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [[ -n "$icd" ]]; then export VK_ICD_FILENAMES="$icd"; fi
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -c '
            openbox --sm-disable > build/pyramid-natural-verify/openbox.log 2>&1 &
            trap "kill $! 2>/dev/null || true" EXIT
            ./gradlew runClientGameTest --args="--width 1280 --height 720" --no-daemon --max-workers=2 2>&1 | tee build/pyramid-natural-verify/client.log
          '
          echo "gradle exit: ${PIPESTATUS[0]}"
          exit 0
      - name: Collect captures and logs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil
          out=Path('docs/captures/pyramid_measure/natural_verify'); out.mkdir(parents=True,exist_ok=True)
          for src in Path('.').rglob('*pyramid-natural-*.png'):
              if 'docs/captures' in str(src): continue
              im=Image.open(src).convert('RGB')
              if im.size != (1280,720): im=im.resize((1280,720),Image.Resampling.LANCZOS)
              im.quantize(colors=256,method=Image.Quantize.MEDIANCUT).save(out/src.name,optimize=True)
          for f in ('client.log','result.json'):
              s=Path('build/pyramid-natural-verify')/f
              if s.exists(): shutil.copy2(s,out/f)
          print('\n'.join(str(p) for p in sorted(out.iterdir())))
          PY
          for f in run/logs/latest.log build/run/clientGameTest/logs/latest.log; do
            [ -f "$f" ] && cp "$f" docs/captures/pyramid_measure/natural_verify/$(echo $f | tr / _) || true
          done
      - name: Commit captures and logs to this branch
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -- src/gametest/resources/fabric.mod.json
          git add docs/captures/pyramid_measure/natural_verify/
          if ! git diff --cached --quiet; then
            git commit -m 'Add pyramid natural generation verify captures and logs'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyramid-natural-verify
          path: docs/captures/pyramid_measure/natural_verify/
          if-no-files-found: warn
      - name: Verdict
        if: always()
        run: |
          d=docs/captures/pyramid_measure/natural_verify
          cat $d/result.json || { echo "NOT RUN: no result.json"; exit 1; }
          if grep -rq ClassCastException $d/*.log; then echo "ClassCastException present: natural verification FAIL"; exit 1; fi
          python3 - <<'PY'
          import json,sys
          r=json.load(open('docs/captures/pyramid_measure/natural_verify/result.json'))
          bad=[k for k in ('generator','locate','structure','capture') if r[k]!='PASS']
          print({k:r[k] for k in ('generator','locate','structure','capture')})
          sys.exit(1 if bad else 0)
          PY
