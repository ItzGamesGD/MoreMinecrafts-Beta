name: Sky island client capture (manual)

# P3.17: reduced to its unique function. The static checks, natural-generation probe and GameTest it used to run are covered by
# sky-islands-validation.yml and build.yml; the size-family / tower-placement probe check and the tower composite unit tests now run in
# sky-islands-validation.yml. This workflow only records real-client screenshots of the sky islands and uploads them as an artifact
# (no push trigger, no commit back to any branch, read-only token).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software renderer and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 python3-pil
      - name: Isolate SkyIslandsClientCapture entrypoint (CI working copy only)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src/gametest/resources/fabric.mod.json')
          d = json.loads(p.read_text())
          d['entrypoints']['fabric-client-gametest'] = ['dev.itzgamesgd.moreminecrafts.mob.sky.SkyIslandsClientCapture']
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY
      - name: Run SkyIslandsClientCapture in Minecraft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sky-capture
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export JAVA_TOOL_OPTIONS='-Dmoreminecrafts.sky.capture=true'
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [[ -n "$icd" ]]; then export VK_ICD_FILENAMES="$icd"; fi
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -c '
            openbox --sm-disable > build/sky-capture/openbox.log 2>&1 &
            trap "kill $! 2>/dev/null || true" EXIT
            ./gradlew runClientGameTest --args="--width 1280 --height 720" --no-daemon --max-workers=2 2>&1 | tee build/sky-capture/client.log
            exit ${PIPESTATUS[0]}
          '
          status=$?
          set -e
          echo "gradle exit status: $status"
          grep -E 'SKY_(CAPTURE|MOB|TOWER|ISLANDS)' build/sky-capture/client.log > build/sky-capture/sky_islands_capture.log || true
          grep -q 'SKY_ISLANDS_CAPTURE_COMPLETE' build/sky-capture/client.log
          test "$status" -eq 0
      - name: Quantize screenshots to 1280x720 palette PNGs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('docs/captures/sky_island_sizes')
          out.mkdir(parents=True, exist_ok=True)
          shots = sorted(p for p in Path('.').rglob('*sky-islands-*.png') if out not in p.parents)
          print("found", len(shots))
          for src in shots:
              img = Image.open(src).convert('RGB')
              if img.size != (1280, 720):
                  img = img.resize((1280, 720), Image.Resampling.LANCZOS)
              img.quantize(colors=256, method=Image.Quantize.MEDIANCUT).save(out / src.name, optimize=True)
          PY
          cp build/sky-capture/sky_islands_capture.log docs/captures/sky_island_sizes/sky_islands_capture.log 2>/dev/null || true
          ls -la docs/captures/sky_island_sizes
      - name: Upload captures and client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-sizes-captures
          path: |
            docs/captures/sky_island_sizes/
            build/sky-capture/client.log
          if-no-files-found: error
