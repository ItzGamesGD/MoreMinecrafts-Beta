name: Sky island sizes verification (static, gametest, probe, capture)

on:
  push:
    branches:
      - claude/sky-island-sizes-20261117
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/structures/requirements.txt
      - name: Generator output is reproducible
        run: python3 scripts/structures/sky_islands/generate.py --check
      - name: Static template, pool, structure and size-family validation
        run: python3 scripts/structures/sky_islands/validate.py
      - name: Tower composite unit tests
        run: python3 -I -m unittest discover -s scripts/structures/sky_islands -p 'test_tower_composite.py'

  worldgen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [2632028, 2632029, 2632030]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Natural generation probe
        run: tools/sky-islands-probe/run_probe.sh ${{ matrix.seed }} 160
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sky-sizes-probe-${{ matrix.seed }}
          path: |
            build/sky-islands-probe/results/*.json
            build/sky-islands-probe/logs/*.log
          if-no-files-found: warn

  probe-check:
    needs: worldgen-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sky-sizes-probe-*
          merge-multiple: true
          path: probe
      - name: Tower only on large islands, child inside parent, all size families generated
        run: |
          python3 -I - <<'PY'
          import glob, json, sys
          starts, towers, viol = {}, {}, []
          for f in sorted(glob.glob("probe/results/*.json")):
              d = json.load(open(f))
              for k, v in d["start_element_counts"].items(): starts[k] = starts.get(k, 0) + v
              for k, v in d["tower_parent_counts"].items(): towers[k] = towers.get(k, 0) + v
              viol += d["tower_violations"]
          fam = {"small": 0, "medium": 0, "large": 0}
          for k, v in starts.items():
              for p, name in (("plain_small", "small"), ("plain_medium", "medium"), ("large_", "large")):
                  if k.startswith(p): fam[name] += v
          print("start_element_counts", dict(sorted(starts.items())))
          print("family_counts", fam, "tower_parents", towers, "violations", viol)
          ok = (not viol and towers and set(towers) <= {"large_d", "large_e"} and all(v > 0 for v in fam.values()))
          sys.exit(0 if ok else 1)
          PY

  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: compileGametestJava and runGameTest with JUnit XML report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gametest-report
          rm -rf build/run/gameTest
          export JAVA_TOOL_OPTIONS="-Dfabric-api.gametest.report-file=$GITHUB_WORKSPACE/build/gametest-report/junit.xml"
          ./gradlew compileGametestJava runGameTest --no-daemon 2>&1 | tee build/gametest-report/gradle.log
      - name: Sky test results from the JUnit report
        if: always()
        shell: bash
        run: |
          python3 -I - <<'PY' | tee build/gametest-report/sky-results.txt
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("build/gametest-report/junit.xml")
          if not p.exists():
              print("NO_REPORT: junit.xml was not written"); sys.exit(1)
          root = ET.parse(p).getroot()
          cases = list(root.iter("testcase"))
          total = len(cases)
          bad_all = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          print(f"TOTAL testcases={total} failed={len(bad_all)}")
          for c in bad_all:
              print("FAILED_ANY", c.get("classname"), c.get("name"))
          sky = [c for c in cases if "sky" in ((c.get("classname") or "") + (c.get("name") or "")).lower()]
          sky_fail = 0
          for c in sky:
              bad = c.find("failure") is not None or c.find("error") is not None
              skipped = c.find("skipped") is not None
              sky_fail += bad
              print("SKY", "FAIL" if bad else ("SKIP" if skipped else "PASS"), c.get("classname"), c.get("name"))
          print(f"SKY_SUMMARY executed={len(sky)} failed={sky_fail}")
          sys.exit(0 if sky and not sky_fail else 1)
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-sizes-gametest-report
          path: build/gametest-report/
          if-no-files-found: warn

  client-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software renderer and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 python3-pil
      - name: Isolate SkyIslandsClientCapture entrypoint (CI working copy only)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('src/gametest/resources/fabric.mod.json')
          d = json.loads(p.read_text())
          d['entrypoints']['fabric-client-gametest'] = ['dev.itzgamesgd.moreminecrafts.mob.sky.SkyIslandsClientCapture']
          p.write_text(json.dumps(d, indent=2) + '\n')
          PY
      - name: Run SkyIslandsClientCapture in Minecraft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/sky-capture
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
          export JAVA_TOOL_OPTIONS='-Dmoreminecrafts.sky.capture=true'
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          if [[ -n "$icd" ]]; then export VK_ICD_FILENAMES="$icd"; fi
          set +e
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash -c '
            openbox --sm-disable > build/sky-capture/openbox.log 2>&1 &
            trap "kill $! 2>/dev/null || true" EXIT
            ./gradlew runClientGameTest --args="--width 1280 --height 720" --no-daemon --max-workers=2 2>&1 | tee build/sky-capture/client.log
            exit ${PIPESTATUS[0]}
          '
          status=$?
          set -e
          echo "gradle exit status: $status"
          grep -E 'SKY_(CAPTURE|MOB|TOWER|ISLANDS)' build/sky-capture/client.log > build/sky-capture/sky_islands_capture.log || true
          grep -q 'SKY_ISLANDS_CAPTURE_COMPLETE' build/sky-capture/client.log
          test "$status" -eq 0
      - name: Quantize screenshots to 1280x720 palette PNGs
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path('docs/captures/sky_island_sizes')
          out.mkdir(parents=True, exist_ok=True)
          shots = sorted(p for p in Path('.').rglob('*sky-islands-*.png') if out not in p.parents)
          print("found", len(shots))
          for src in shots:
              img = Image.open(src).convert('RGB')
              if img.size != (1280, 720):
                  img = img.resize((1280, 720), Image.Resampling.LANCZOS)
              img.quantize(colors=256, method=Image.Quantize.MEDIANCUT).save(out / src.name, optimize=True)
          PY
          cp build/sky-capture/sky_islands_capture.log docs/captures/sky_island_sizes/sky_islands_capture.log 2>/dev/null || true
          ls -la docs/captures/sky_island_sizes
      - name: Upload captures and client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-sizes-captures
          path: |
            docs/captures/sky_island_sizes/
            build/sky-capture/client.log
          if-no-files-found: error
      - name: Commit captures to the task branch (non-force, this branch only)
        if: always() && github.ref == 'refs/heads/claude/sky-island-sizes-20261117'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- src/gametest/resources/fabric.mod.json
          git add docs/captures/sky_island_sizes
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "docs(captures): sky islands client captures from run ${GITHUB_RUN_NUMBER}"
          for i in 1 2 3 4; do
            git fetch origin claude/sky-island-sizes-20261117
            git rebase -X theirs origin/claude/sky-island-sizes-20261117 && git push origin HEAD:claude/sky-island-sizes-20261117 && exit 0
            sleep $((i*3))
          done
          exit 1
