name: Sky Islands Validation

on:
  push:
    branches:
      - feature/wave14-sky-islands-20261028
  pull_request:
    paths:
      - 'src/main/resources/data/moreminecrafts/**'
      - 'scripts/structures/sky_islands/**'
      - 'tools/sky-islands-probe/**'
      - 'src/gametest/**'
      - '.github/workflows/sky-islands-validation.yml'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator requirements
        run: pip install -r scripts/structures/requirements.txt
      - name: Generator output is reproducible
        run: python3 scripts/structures/sky_islands/generate.py --check
      - name: Static template, pool, structure and loot validation
        run: python3 scripts/structures/sky_islands/validate.py
      - name: Tower composite unit tests
        run: python3 -I -m unittest discover -s scripts/structures/sky_islands -p 'test_tower_composite.py'

  worldgen-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [2632028, 2632029, 2632030]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Natural generation probe (real Overworld generator, forced FULL chunks)
        run: tools/sky-islands-probe/run_probe.sh ${{ matrix.seed }} 160
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-islands-probe-${{ matrix.seed }}
          path: |
            build/sky-islands-probe/results/*.json
            build/sky-islands-probe/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  coverage:
    needs: worldgen-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sky-islands-probe-*
          merge-multiple: true
          path: probe
      - name: Every building variant generated and passed its physical checks in at least one seed
        run: |
          python3 -I - <<'PY'
          import glob, json, sys
          seen, bad = set(), []
          for f in sorted(glob.glob("probe/results/*.json")):
              d = json.load(open(f))
              for name, row in d["physical"].items():
                  seen.add(name)
                  if not row["pass"]:
                      bad.append((f, name))
          want = {"ruins_a", "ruins_b", "ruins_c", "ruins_d", "temple"}
          tower_starts = sum(d.get("island_pieces_by_kind", {}).get("tower", 0) for d in [json.load(open(f)) for f in sorted(glob.glob("probe/results/*.json"))])
          print("seen", sorted(seen), "missing", sorted(want - seen), "failed", bad, "composite_tower_starts", tower_starts)
          sys.exit(0 if seen == want and not bad and tower_starts > 0 else 1)
          PY
      - name: Tower only on large islands, child inside parent, all size families generated
        run: |
          python3 -I - <<'PY'
          import glob, json, sys
          starts, towers, viol = {}, {}, []
          for f in sorted(glob.glob("probe/results/*.json")):
              d = json.load(open(f))
              for k, v in d["start_element_counts"].items(): starts[k] = starts.get(k, 0) + v
              for k, v in d["tower_parent_counts"].items(): towers[k] = towers.get(k, 0) + v
              viol += d["tower_violations"]
          fam = {"small": 0, "medium": 0, "large": 0}
          for k, v in starts.items():
              for p, name in (("plain_small", "small"), ("plain_medium", "medium"), ("large_", "large")):
                  if k.startswith(p): fam[name] += v
          print("start_element_counts", dict(sorted(starts.items())))
          print("family_counts", fam, "tower_parents", towers, "violations", viol)
          ok = (not viol and towers and set(towers) <= {"large_d", "large_e"} and all(v > 0 for v in fam.values()))
          sys.exit(0 if ok else 1)
          PY
