name: Cloud Wraith visual validation
on:
  push:
    branches: [feature/sky-mob-p2b-cloud-wraith]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect 26.3 translucent pipeline
        run: |
          ./gradlew genSources --no-daemon
          python3 - <<'PYCODE'
          from pathlib import Path
          import zipfile
          targets = ('RenderTypes.java', 'RenderPipelines.java')
          seen = set()
          for root in (Path('.gradle'), Path.home()/'.gradle/caches/fabric-loom'):
              if not root.exists(): continue
              for jarpath in root.rglob('*sources*.jar'):
                  try:
                      with zipfile.ZipFile(jarpath) as jar:
                          for name in jar.namelist():
                              if name.rsplit('/',1)[-1] in targets and name not in seen:
                                  print('RENDER_SOURCE_BEGIN', name)
                                  print(jar.read(name).decode('utf-8'))
                                  print('RENDER_SOURCE_END', name)
                                  seen.add(name)
                  except (OSError,zipfile.BadZipFile): pass
          print('RENDER_SOURCES_FOUND', len(seen))
          PYCODE
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools ffmpeg python3-pil
      - name: Capture Minecraft scenes
        run: bash scripts/sky-wraith-validation/capture.sh
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-wraith-visual-${{ github.sha }}
          path: sky-wraith-results/
          if-no-files-found: error
