name: Cloud Wraith visual validation
on:
  push:
    branches: [feature/sky-mob-p2b-cloud-wraith]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect particle API
        run: |
          ./gradlew genSources --no-daemon
          python3 - <<'PYCODE'
          import pathlib,zipfile
          names={'SingleQuadParticle.java','TextureSheetParticle.java','SmokeParticle.java','DustParticle.java','ParticleResources.java','SpriteSet.java','ParticleGroup.java'}
          seen=set()
          for root in (pathlib.Path('.gradle'),pathlib.Path.home()/'.gradle/caches'):
              if not root.exists(): continue
              for path in root.rglob('*sources*.jar'):
                  try:
                      with zipfile.ZipFile(path) as z:
                          for name in z.namelist():
                              if (name.rsplit('/',1)[-1] in names or ('/particle/' in name and ('Cloud' in name or 'Smoke' in name))) and name not in seen:
                                  print('PARTICLE_SOURCE_BEGIN',name);print(z.read(name).decode());print('PARTICLE_SOURCE_END',name);seen.add(name)
                  except (OSError,zipfile.BadZipFile): pass
          print('PARTICLE_SOURCE_COUNT',len(seen))
          PYCODE
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools ffmpeg python3-pil
      - name: Capture Minecraft scenes
        run: bash scripts/sky-wraith-validation/capture.sh
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-wraith-visual-${{ github.sha }}
          path: sky-wraith-results/
          if-no-files-found: error
