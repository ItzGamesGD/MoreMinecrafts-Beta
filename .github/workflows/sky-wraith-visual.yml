name: Cloud Wraith visual validation
on:
  push:
    branches: [feature/sky-mob-p2b-cloud-wraith]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools
      - name: Capture Minecraft scenes
        run: bash scripts/sky-wraith-validation/capture.sh
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-wraith-visual-${{ github.sha }}
          path: sky-wraith-results/
          if-no-files-found: error
