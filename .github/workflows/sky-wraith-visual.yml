name: Cloud Wraith visual validation
on:
  push:
    branches: [feature/sky-mob-p2b-cloud-wraith]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect Minecraft animation API
        run: |
          ./gradlew genSources --no-daemon
          python3 - <<'PYCODE'
          import pathlib, zipfile
          wanted = {'ZombieModel.java', 'HumanoidModel.java', 'ZombieRenderState.java', 'HumanoidRenderState.java', 'LivingEntityRenderState.java', 'ZombieRenderer.java', 'AbstractZombieRenderer.java', 'LivingEntityRenderer.java', 'AnimationUtils.java'}
          found = set()
          for root in (pathlib.Path('.gradle'), pathlib.Path.home() / '.gradle/caches/fabric-loom'):
              if not root.exists(): continue
              for path in root.rglob('*sources*.jar'):
                  try:
                      with zipfile.ZipFile(path) as jar:
                          for name in jar.namelist():
                              if name.rsplit('/',1)[-1] in wanted and name not in found:
                                  print('SOURCE_BEGIN', name)
                                  print(jar.read(name).decode('utf-8'))
                                  print('SOURCE_END', name)
                                  found.add(name)
                  except (OSError, zipfile.BadZipFile): pass
          print('SOURCES_FOUND', len(found))
          PYCODE
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools
      - name: Capture Minecraft scenes
        run: bash scripts/sky-wraith-validation/capture.sh
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-wraith-visual-${{ github.sha }}
          path: sky-wraith-results/
          if-no-files-found: error
