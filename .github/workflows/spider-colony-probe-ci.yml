name: Spider Colony Probe CI

on:
  workflow_dispatch:

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew --no-daemon --max-workers=2 build -x runGameTest

      - name: Run GameTests
        run: ./gradlew --no-daemon --max-workers=2 runGameTest

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-colony-probe-reports
          path: |
            build/reports/
            build/test-results/
            build/gametest/
          if-no-files-found: ignore
