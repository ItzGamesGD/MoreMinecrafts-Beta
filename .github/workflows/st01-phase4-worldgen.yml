name: ST-01 Phase 4 Worldgen
on:
  push:
    branches: [claude/st01-pyramid-phase4-worldgen-roke2l]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, all unit tests (includes St01EligibilityTest boundary tests and St01WorldgenResourceTest)
        run: ./gradlew build compileGametestJava -x runGameTest --no-daemon --max-workers=2
      - name: Royal chest and actual D1 transform GameTests (P8-B2 regression)
        env:
          JAVA_TOOL_OPTIONS: '-Dmm.royal.placement=true -Dfabric-api.gametest.filter=moreminecrafts-gametest:*royal_chest_game_tests*'
        run: ./gradlew runGameTest --no-daemon --max-workers=2
      - name: Guardian regression GameTests
        env:
          JAVA_TOOL_OPTIONS: '-Dfabric-api.gametest.filter=moreminecrafts-gametest:tomb_guardian_game_tests_*'
        run: ./gradlew runGameTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st01-phase4-regression
          path: |
            build/test-results/
            build/reports/tests/
          retention-days: 14

  worldgen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 1001-1005: the five Phase 3.1 reference seeds. The rest: independent deterministic batch, seed_i = (i * 0x9E3779B1 + 20261110) mod 2^31, i = 1..10.
        seed: [1001, 1002, 1003, 1004, 1005, 527213223, 1034165336, 1541117449, 2048069562, 407538027, 914490140, 1421442253, 1928394366, 287862831, 794814944]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Real server - scan, reverse-order replay and restart reload (fails on any mismatch)
        run: tools/st01-phase4/run_validation.sh ${{ matrix.seed }} 10240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st01-phase4-seed-${{ matrix.seed }}
          path: |
            build/st01-phase4/results/${{ matrix.seed }}/
            build/st01-phase4/logs/${{ matrix.seed }}/
          retention-days: 30

  client-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install display and software-GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 x11-utils
      - name: Scan seed 1004 on a real server (gives the start list for the capture)
        run: tools/st01-phase4/run_validation.sh 1004 9300
      - name: Rendered-client capture of the naturally generated starts (visual evidence)
        run: MAX_TARGETS=2 tools/st01-phase4/run_client_capture.sh 1004 build/st01-phase4/results/1004/scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st01-phase4-client-capture
          path: |
            build/st01-phase4/client/
            build/st01-phase4/results/1004/scan.json
          retention-days: 30

  aggregate:
    needs: worldgen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: st01-phase4-seed-*
          path: seeds
      - name: Aggregate per-seed statistics
        run: |
          mkdir -p agg
          find seeds -name scan.json | while read -r f; do s=$(basename "$(dirname "$f")"); mkdir -p "agg/$s"; cp "$f" "agg/$s/scan.json"; done
          ls agg
          python3 -I tools/st01-phase4/aggregate.py agg agg/aggregate.json agg/aggregate.md
      - uses: actions/upload-artifact@v4
        with:
          name: st01-phase4-aggregate
          path: agg/
          retention-days: 90
