name: Tomb summon flake repeat

on:
  push:
    branches:
      - claude/tomb-test-flake-20261116

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Full GameTest suite (same as Fabric CI)
        run: |
          set -o pipefail
          ./gradlew compileGametestJava runGameTest 2>&1 | tee gametest-${{ matrix.run }}.log
      - name: Summon test result
        if: always()
        run: grep -n "royal_guard_summons\|required tests failed" gametest-${{ matrix.run }}.log | cut -c1-400 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-log-${{ matrix.run }}
          path: gametest-${{ matrix.run }}.log
