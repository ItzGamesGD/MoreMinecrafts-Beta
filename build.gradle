plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

apply from: "gradle/validate-flame-sword-production.gradle"
apply from: "gradle/validate-fishing-resources.gradle"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.gegy.dev/releases/"
        content {
            includeGroup("dev.lambdaurora.lambdynamiclights")
            includeGroup("dev.yumi.commons")
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "moreminecrafts" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    clientQa {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
    }
}

loom {
    mods {
        "moreminecrafts_client_qa" {
            sourceSet sourceSets.clientQa
        }
    }
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "moreminecrafts-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.13.0+26.3"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events "failed"
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showCauses = true
        showStackTraces = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

tasks.register("verifyClientQaExcludedFromRemapJar") {
    group = "verification"
    description = "Checks the production remap JAR does not contain the client QA mod."
    dependsOn tasks.matching { it.name == "remapJar" }
    doLast {
        def remapJarTask = tasks.findByName("remapJar")
        assert remapJarTask != null : "Loom did not register remapJar"
        def archive = remapJarTask.archiveFile.get().asFile
        def qaPackage = "dev/itzgamesgd/moreminecrafts/clientqa/"
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def names = zip.entries().collect { it.name }
            assert names.every { !it.startsWith(qaPackage) } :
                    "Production JAR contains a client QA class from " + qaPackage
            def metadata = zip.getEntry("fabric.mod.json")
            assert metadata != null : "Production JAR has no fabric.mod.json"
            def metadataText = zip.getInputStream(metadata).getText("UTF-8")
            assert !metadataText.contains("moreminecrafts_client_qa") :
                    "Production JAR metadata declares the client QA mod"
        } finally {
            zip.close()
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
