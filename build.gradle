plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "moreminecrafts" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events "failed"
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showCauses = true
        showStackTraces = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("validateStage6Data") {
    group = "verification"
    description = "Validates the required Stage 6 data/resource JSON and custom references."
    doLast {
        def json = new groovy.json.JsonSlurper()
        def resourceRoot = file("src/main/resources")
        def families = [
                titanium: ["titanium_ore", "raw_titanium", "titanium_ingot"],
                tungsten: ["tungsten_ore", "raw_tungsten", "tungsten_ingot"],
                mythril: ["mythril_ore", "mythril"],
                etherium: ["etherium_ore", "etherium"],
                adamantium: ["adamantium_debris", "adamantium_ingot"]
        ]
        def validHeightProviders = [
                "minecraft:constant", "minecraft:uniform", "minecraft:biased_to_bottom",
                "minecraft:very_biased_to_bottom", "minecraft:trapezoid", "minecraft:weighted_list"
        ] as Set
        def requiredPlacementModifiers = ["minecraft:in_square", "minecraft:height_range", "minecraft:biome"] as Set

        fileTree(resourceRoot).matching { include "**/*.json" }.files.each { json.parse(it) }
        families.each { family, ids ->
            def configuredFile = file("src/main/resources/data/moreminecrafts/worldgen/configured_feature/ore_${family}.json")
            def placedFile = file("src/main/resources/data/moreminecrafts/worldgen/placed_feature/ore_${family}.json")
            assert configuredFile.isFile()
            assert placedFile.isFile()
            def configured = json.parse(configuredFile)
            def placed = json.parse(placedFile)
            assert configured.type == "minecraft:ore"
            assert placed.feature == "moreminecrafts:ore_${family}"
            def modifierTypes = placed.placement.collect { it.type } as Set
            assert modifierTypes.containsAll(requiredPlacementModifiers)
            def heightRange = placed.placement.find { it.type == "minecraft:height_range" }
            assert validHeightProviders.contains(heightRange.height.type) :
                    "Unsupported Minecraft 26.3 height provider ${heightRange.height.type} in ${placedFile}"
            ids.each { id ->
                assert file("src/main/resources/assets/moreminecrafts/items/${id}.json").isFile()
            }
        }

        fileTree("src/main/resources/data/moreminecrafts/worldgen/placed_feature").matching { include "*.json" }.files.each { placedFile ->
            def placed = json.parse(placedFile)
            def heightRange = placed.placement.find { it.type == "minecraft:height_range" }
            assert heightRange != null
            assert validHeightProviders.contains(heightRange.height.type) :
                    "Unsupported Minecraft 26.3 height provider ${heightRange.height.type} in ${placedFile}"
        }

        fileTree("src/main/resources/assets/moreminecrafts/items").matching { include "*.json" }.files.each { itemFile ->
            def model = json.parse(itemFile).model.model as String
            if (model?.startsWith("moreminecrafts:")) {
                def modelPath = model.substring("moreminecrafts:".length())
                assert file("src/main/resources/assets/moreminecrafts/models/${modelPath}.json").isFile() :
                        "Missing model ${model} referenced by ${itemFile}"
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("validateStage6Data")
}
