plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "moreminecrafts" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    testLogging {
        events "failed"
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showCauses = true
        showStackTraces = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.register("validateStage6Data") {
    group = "verification"
    description = "Validates the required Stage 6 data/resource JSON and custom references."
    doLast {
        def json = new groovy.json.JsonSlurper()
        def resourceRoot = file("src/main/resources")
        def families = [
                titanium: ["titanium_ore", "raw_titanium", "titanium_ingot"],
                tungsten: ["tungsten_ore", "raw_tungsten", "tungsten_ingot"],
                mythril: ["mythril_ore", "mythril"],
                etherium: ["etherium_ore", "etherium"],
                adamantium: ["adamantium_debris", "adamantium_ingot"]
        ]

        fileTree(resourceRoot).matching { include "**/*.json" }.files.each { json.parse(it) }
        families.each { family, ids ->
            assert file("src/main/resources/data/moreminecrafts/worldgen/configured_feature/ore_${family}.json").isFile()
            assert file("src/main/resources/data/moreminecrafts/worldgen/placed_feature/ore_${family}.json").isFile()
            ids.each { id ->
                assert file("src/main/resources/assets/moreminecrafts/items/${id}.json").isFile()
            }
        }

        fileTree("src/main/resources/assets/moreminecrafts/items").matching { include "*.json" }.files.each { itemFile ->
            def model = json.parse(itemFile).model.model as String
            if (model?.startsWith("moreminecrafts:")) {
                def modelPath = model.substring("moreminecrafts:".length())
                assert file("src/main/resources/assets/moreminecrafts/models/${modelPath}.json").isFile() :
                        "Missing model ${model} referenced by ${itemFile}"
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("validateStage6Data")
}

tasks.register("validateFlameSwordResources") {
    group = "verification"
    description = "Checks the C1-A sword model chain and distributable JAR."
    dependsOn tasks.named("jar")

    doLast {
        def json = new groovy.json.JsonSlurper()
        def source = file("src/main/java/dev/itzgamesgd/moreminecrafts/registry/ModItems.java").text
        assert (source =~ /public static final ResourceKey<Item> FLAME_SWORD_KEY\s*=/).findAll().size() == 1
        assert (source =~ /public static final Item FLAME_SWORD\s*=\s*Registry\.register\(\s*BuiltInRegistries\.ITEM,\s*FLAME_SWORD_KEY,/).findAll().size() == 1

        def itemPath = "assets/moreminecrafts/items/flame_sword.json"
        def modelPath = "assets/moreminecrafts/models/item/flame_sword.json"
        def enPath = "assets/moreminecrafts/lang/en_us.json"
        def koPath = "assets/moreminecrafts/lang/ko_kr.json"
        def paths = [itemPath, modelPath, enPath, koPath]
        def resources = paths.collectEntries { path ->
            def resource = file("src/main/resources/${path}")
            assert resource.isFile() : "Missing Flame Sword resource: ${path}"
            [(path): json.parse(resource)]
        }

        assert resources[itemPath].model.type == "minecraft:model"
        assert resources[itemPath].model.model == "moreminecrafts:item/flame_sword"
        assert resources[modelPath].parent == "minecraft:item/handheld"
        // The temporary texture is supplied by Minecraft, not bundled in the mod JAR.
        assert resources[modelPath].textures.layer0 == "minecraft:item/netherite_sword"
        assert resources[enPath]["item.moreminecrafts.flame_sword"] == "Flame Sword"
        assert resources[koPath]["item.moreminecrafts.flame_sword"] == "불꽃검"

        def distributable = tasks.named("jar").get().archiveFile.get().asFile
        assert distributable.isFile() : "Missing distributable mod JAR: ${distributable}"
        new java.util.zip.ZipFile(distributable).withCloseable { jar ->
            paths.each { path ->
                def entries = java.util.Collections.list(jar.entries()).findAll { it.name == path }
                assert entries.size() == 1 : "Expected exactly one ${path} in ${distributable}"
                def packed = jar.getInputStream(entries[0]).withCloseable { json.parse(it) }
                assert packed == resources[path] : "JAR resource differs from source: ${path}"
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("validateFlameSwordResources")
}
