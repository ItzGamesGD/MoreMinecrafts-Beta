tasks.register("validateAccessoryResources") {
    group = "verification"
    description = "Validates item definition, model, and 32x32 texture for every registered accessory."
    doLast {
        def json = new groovy.json.JsonSlurper()
        def src = file("src/main/java/dev/itzgamesgd/moreminecrafts/accessory/AccessoryDefinition.java").text
        def ids = (src =~ /(?m)^\s+[A-Z_]+\("([a-z_]+)",\s*"item\.moreminecrafts\.\1"/).collect { it[1] }
        assert ids.size() == 12 : "Expected 12 registered accessories, found ${ids}"
        def assets = file("src/main/resources/assets/moreminecrafts")
        ids.each { id ->
            def itemFile = new File(assets, "items/${id}.json")
            def modelFile = new File(assets, "models/item/${id}.json")
            def textureFile = new File(assets, "textures/item/${id}.png")
            assert itemFile.isFile() : "Missing item definition for ${id}"
            assert modelFile.isFile() : "Missing model for ${id}"
            assert textureFile.isFile() : "Missing texture for ${id}"
            def item = json.parse(itemFile)
            assert item.model.type == "minecraft:model" && item.model.model == "moreminecrafts:item/${id}" :
                    "Item definition for ${id} does not resolve to its model"
            def model = json.parse(modelFile)
            assert model.parent == "minecraft:item/generated" && model.textures.layer0 == "moreminecrafts:item/${id}" :
                    "Model for ${id} does not reference its texture"
            def image = javax.imageio.ImageIO.read(textureFile)
            assert image.width == 32 && image.height == 32 : "Texture for ${id} must be 32x32"
            assert image.colorModel.hasAlpha() : "Texture for ${id} must be RGBA"
            int opaque = 0
            for (int y = 0; y < 32; y++) for (int x = 0; x < 32; x++) if ((image.getRGB(x, y) >>> 24) != 0) opaque++
            assert opaque >= 120 && opaque <= 900 : "Texture for ${id} has implausible opaque pixel count ${opaque}"
            // no transparent-to-edge bleed: border row/column must stay clear
            for (int i = 0; i < 32; i++) {
                assert (image.getRGB(i, 0) >>> 24) == 0 && (image.getRGB(i, 31) >>> 24) == 0 &&
                        (image.getRGB(0, i) >>> 24) == 0 && (image.getRGB(31, i) >>> 24) == 0 :
                        "Texture for ${id} touches the image border"
            }
        }
        def textures = new File(assets, "textures/item")
        assert ids.every { a -> ids.findAll { b -> b != a }.every { b -> new File(textures, "${a}.png").bytes != new File(textures, "${b}.png").bytes } } :
                "Accessory textures must be distinct"
        println "Accessory resources validated: ${ids}"
    }
}

tasks.named("check") { dependsOn tasks.named("validateAccessoryResources") }
