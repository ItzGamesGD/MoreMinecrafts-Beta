name: Fallen Sentinel visual validation
on:
  push:
    branches: [claude/sky-mob-p2f1-blood-seraph]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool x11-utils scrot libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers mesa-utils vulkan-tools ffmpeg python3-pil
      - name: Capture Minecraft scenes
        run: bash scripts/fallen-sentinel-validation/capture.sh
      - name: Upload capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallen-sentinel-visual-${{ github.sha }}
          path: fallen-sentinel-results/
          if-no-files-found: error
