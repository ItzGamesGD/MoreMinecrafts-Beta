// Visual-validation-only compatibility: the current production ore feature JSON uses
// a height-provider schema rejected by Minecraft 26.3 during world load. The screenshot
// scene is built explicitly with vanilla blocks, so omit only those inputs for this run.
allprojects {
    tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
        exclude("data/moreminecrafts/worldgen/configured_feature/**")
        exclude("data/moreminecrafts/worldgen/placed_feature/**")
    }
}


// With CI set (GitHub Actions), Loom wraps runClient in its own xvfb-run, so the client opens on a second
// display instead of the Xvfb this harness captures, focuses and sends XTest input to. Keep the client on it.
allprojects {
    tasks.matching { it.name == "runClient" }.configureEach { task ->
        if (task.hasProperty("useXvfb")) task.useXvfb.set(false)
    }
}
