// Phase 2 validation only: per-run server run directory (env AD_RUN_DIR) so several probe runs never share a world.
allprojects {
    afterEvaluate { project ->
        def dir = System.getenv('AD_RUN_DIR')
        if (dir != null) {
            project.extensions.getByName('loom').runs.getByName('skyIslandsProbe').setRunDir(dir)
        }
    }
}
